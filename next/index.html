<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Gratified — Menu Studio</title>

<!-- Satoshi (Fontshare) · Bluu Next (CDN Fonts) · IBM Plex Mono (Google) -->
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/bluu-next" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style id="pageSize"></style>
<style>
/* =========================================================
   Gratified menu studio — month 3
   paul graham (plain words, nothing extra)
   × techno morocco (zellige khatam stars, mono details)
   × arts + crafts (double rules, hand-drawn scribbles,
     misregistered block-print washes)
   The old rotated square lives on: a square + a rotated
   square = the eight-point khatam star.
   ========================================================= */
:root{
  --ox:#722F37; --orange:#CC5500; --amber:#D2691E; --olive:#6B5740;
  --cream:#EDE8E0; --paper:#F5F1EA; --char:#2E2B28; --sand:#E6C89C;
  --gold:#E8A317; --teal:#1F5E5B;
  --serif:'Bluu Next', Georgia, serif;
  --sans:'Satoshi', system-ui, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ font-family:var(--sans); color:var(--char); background:#E2DCD0; overflow:hidden; }

/* ---------- top bar ---------- */
#bar{
  height:56px; display:flex; align-items:center; gap:18px; padding:0 16px;
  background:var(--cream); border-bottom:3px solid var(--ox);
}
.brand{ display:flex; align-items:center; gap:10px; white-space:nowrap; }
.brand b{ font-family:var(--serif); font-weight:700; color:var(--ox); font-size:19px; letter-spacing:1px; }
.brand small{ font-family:var(--mono); font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--olive); }
#docTabs{ display:flex; gap:4px; }
.bar-r{ margin-left:auto; display:flex; align-items:center; gap:10px; }
#status{ font:11px var(--mono); color:var(--olive); min-width:150px; text-align:right; }

button{
  font:600 12px var(--sans); letter-spacing:.6px; text-transform:lowercase;
  padding:7px 13px; border:1.5px solid var(--ox); background:transparent; color:var(--ox);
  cursor:pointer; transition:background .2s, color .2s; border-radius:0;
}
button:hover, button.on{ background:var(--ox); color:var(--cream); }
button.solid{ background:var(--ox); color:var(--cream); }
button.solid:hover{ background:var(--orange); border-color:var(--orange); }

select, input, textarea{
  font:13px var(--sans); color:var(--char); background:rgba(255,255,255,.55);
  border:1.5px solid rgba(114,47,55,.22); padding:6px 8px; outline:none; border-radius:0;
  min-width:0;
}
select:focus, input:focus, textarea:focus{ border-color:var(--orange); background:#fff; }
textarea{ resize:vertical; width:100%; line-height:1.4; }

/* ---------- layout ---------- */
main{ display:grid; grid-template-columns:450px 1fr; height:calc(100vh - 56px); }
#panel{ overflow:auto; background:var(--paper); border-right:1px solid rgba(114,47,55,.2); }
.ptabs{
  position:sticky; top:0; z-index:3; display:flex; gap:6px; padding:12px 16px;
  background:var(--paper); border-bottom:1px solid rgba(114,47,55,.15);
}
.pbody{ padding:14px 16px 80px; }
.hint{ font-size:12.5px; line-height:1.5; color:var(--olive); margin:0 0 14px; }
.hint b{ color:var(--ox); }

/* section cards */
.sc{ border:1.5px solid rgba(114,47,55,.2); background:#fff9; margin-bottom:10px; }
.sc-head{ display:flex; align-items:center; gap:6px; padding:7px; }
.sc-name{ flex:1; font-family:var(--serif); font-weight:700; font-size:16px; color:var(--ox); border-color:transparent; background:transparent; }
.sc-head select{ width:118px; font-size:12px; }
.cnt{ font:11px var(--mono); color:var(--olive); width:22px; text-align:center; }
.tw{ padding:4px 8px; font-size:13px; border-color:transparent; }
.sc-body{ padding:4px 10px 10px; border-top:1px dashed rgba(114,47,55,.2); }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:8px 0; }
.logo-row{ display:flex; align-items:center; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
.logo-prev{ width:92px; height:40px; display:flex; align-items:center; justify-content:center; background:var(--cream); border:1px dashed rgba(114,47,55,.3); font:10px var(--mono); color:var(--olive); }
.logo-prev img{ max-width:86px; max-height:34px; object-fit:contain; }
.sp{ flex:1; }
.mini{
  display:inline-flex; align-items:center; font:600 11px var(--sans); letter-spacing:.4px; text-transform:lowercase;
  padding:5px 8px; border:1px solid rgba(114,47,55,.45); color:var(--ox); background:transparent; cursor:pointer;
}
.mini:hover{ background:var(--ox); color:var(--cream); }
.mini.warn{ border-color:rgba(204,85,0,.6); color:var(--orange); }
.mini.warn:hover{ background:var(--orange); color:#fff; }
.add{ margin-top:6px; }
.add-sec{ width:100%; padding:10px; margin-top:4px; }

/* item rows */
.ir{ border-top:1px solid rgba(114,47,55,.1); padding:5px 0; }
.ir-top{ display:flex; align-items:center; gap:6px; }
.ir-ic{ width:34px; height:34px; flex:none; display:block; }
.ir-ic svg, .ir-ic img{ width:100%; height:100%; object-fit:contain; display:block; }
.ir-name{ flex:1; font-weight:700; }
.ir-price{ width:70px; font-family:var(--mono); font-size:12px; }
.wl{ display:flex; align-items:center; gap:3px; font:11px var(--mono); color:var(--olive); cursor:pointer; user-select:none; }
.wl input{ accent-color:var(--ox); }
.ir-more{ padding:6px 0 4px 40px; display:flex; flex-direction:column; gap:6px; }
.ir-ctl{ display:flex; gap:5px; flex-wrap:wrap; align-items:center; }
.ir-ctl select{ font-size:12px; padding:4px 6px; }

/* words panel */
.pbody h3{
  font:600 11px var(--mono); letter-spacing:2px; text-transform:uppercase; color:var(--ox);
  margin:22px 0 10px; padding-bottom:6px; border-bottom:1.5px solid var(--ox);
}
.pbody h3:first-child{ margin-top:0; }
label.fl{ display:block; margin-bottom:9px; }
label.fl span{ display:block; font:11px var(--mono); color:var(--olive); margin-bottom:3px; letter-spacing:.5px; }
label.fl input{ width:100%; }
label.chk{ display:flex; align-items:center; gap:7px; font-size:13px; margin:6px 0 10px; cursor:pointer; }
label.chk input{ accent-color:var(--ox); }
.btns{ display:flex; flex-wrap:wrap; gap:6px; }

/* ---------- stage ---------- */
#stage{ overflow:auto; position:relative; }
#pages{ display:flex; flex-wrap:wrap; gap:56px 40px; justify-content:center; align-items:flex-start; padding:28px 28px 70px; }
.pagebox{ position:relative; flex:none; box-shadow:0 10px 34px rgba(60,40,30,.25); background:var(--cream); }
.pagebox > .page{ position:absolute; left:0; top:0; transform-origin:0 0; }
.pagecap{
  position:absolute; left:0; right:0; top:100%; margin-top:12px; text-align:center;
  font:11px var(--mono); letter-spacing:1.5px; text-transform:uppercase; color:var(--olive);
}

#toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
  background:var(--ox); color:var(--cream); padding:11px 20px; font:12px var(--mono); letter-spacing:.5px;
  opacity:0; pointer-events:none; transition:opacity .3s; z-index:50; max-width:90vw; text-align:center;
}
#toast.on{ opacity:1; }

@media (max-width:900px){
  body{ overflow:auto; }
  main{ grid-template-columns:1fr; height:auto; }
  #panel{ max-height:55vh; }
  #stage{ height:80vh; }
  #bar{ height:auto; flex-wrap:wrap; padding:8px 12px; }
}

/* =========================================================
   PRINT PAGES
   1em on a page = 1% of the page width (--base), so every
   layout keeps its proportions at any poster size.
   .fit boxes scale their contents with --k (auto-fitted).
   ========================================================= */
.page{
  position:relative;
  width:calc(var(--pw) * 1px); height:calc(var(--ph) * 1px);
  font-size:calc(var(--base) * 1px);
  background:var(--cream); color:var(--char); overflow:hidden;
  display:flex; flex-direction:column;
  font-family:var(--sans); line-height:1.2;
  -webkit-print-color-adjust:exact; print-color-adjust:exact;
}
.page .mono{ font-family:var(--mono); }
.page .band{ display:block; flex:none; }
.page img{ display:block; }
.st8{ display:inline-block; vertical-align:middle; flex:none; }
.fit{ font-size:calc(1em * var(--k, 1)); }
.chev2{ display:flex; flex-direction:column; align-items:center; }
.chev2 svg{ display:block; width:100%; }
.chev2 svg + svg{ margin-top:-14%; }

/* ---- wall boards ---- */
.wall-in{
  flex:1; min-height:0; margin:1.7em 4.2em; padding:2.6em 3.3em 2em;
  border:.42em double rgba(114,47,55,.55);
  display:flex; flex-direction:column;
}
.wh-top{ display:flex; align-items:center; gap:.9em; }
.wh-name{ font-family:var(--serif); font-weight:700; font-size:2.5em; color:var(--ox); letter-spacing:.04em; }
.wh-sub{ margin-left:auto; font-size:1.55em; letter-spacing:.22em; text-transform:uppercase; color:var(--olive); }
.wh-title{
  display:block; white-space:nowrap; overflow:hidden;
  font-family:var(--serif); font-weight:700; color:var(--ox);
  line-height:1.02; margin:.18em 0 0; padding-top:.06em;
}
.wh-tag{ font-size:2em; letter-spacing:.2em; color:var(--olive); margin-top:.45em; white-space:pre-wrap; }
.wh-rule{ display:flex; align-items:center; gap:.9em; margin:1.5em 0 1.4em; color:var(--ox); }
.wh-rule i{ flex:1; height:.12em; background:currentColor; opacity:.45; }
.wh-rule .st8{ width:1.7em; height:1.7em; }
.wall .fit{ flex:1; min-height:0; overflow:hidden; column-gap:3.4em; column-fill:balance; }
.wall .fit.c2{ column-count:2; }
.wall .fit.c1 .sec{ max-width:42em; margin-left:auto; margin-right:auto; }
.sec{ margin-bottom:2.3em; break-inside:avoid; }
.sec-head{
  display:flex; flex-direction:column; align-items:flex-start; gap:.35em;
  border-bottom:.15em solid var(--ox); padding-bottom:.45em; margin-bottom:1em;
  break-inside:avoid; break-after:avoid;
}
.sec-name{ font-family:var(--serif); font-weight:700; font-size:3.1em; color:var(--ox); line-height:1; display:flex; align-items:center; gap:.3em; }
.sec-name .st8{ width:.55em; height:.55em; }
.sec-src{ display:flex; align-items:center; min-width:0; max-width:100%; }
.sec-src img{ max-height:2.6em; max-width:14em; object-fit:contain; }
.sec-src .mono{ font-size:1.05em; letter-spacing:.14em; text-transform:uppercase; color:var(--olive); text-align:left; line-height:1.3; }
.sec-blurb{ font-size:1.3em; color:var(--olive); margin:-.35em 0 1em; letter-spacing:.05em; }
.it{ display:flex; gap:.8em; align-items:center; break-inside:avoid; margin-bottom:.95em; }
.it-ic{ flex:none; width:3.6em; height:3.6em; }
.it-ic svg, .it-ic img{ width:100%; height:100%; object-fit:contain; }
.it-main{ flex:1; min-width:0; }
.it-row{ display:flex; align-items:baseline; gap:.45em; }
.it-name{ font-weight:700; font-size:2.1em; line-height:1.1; }
.lead{ flex:1; min-width:1em; border-bottom:.17em dotted rgba(46,43,40,.38); transform:translateY(-.25em); }
.it-price{ font-family:var(--mono); font-weight:500; font-size:1.9em; color:var(--ox); white-space:nowrap; }
.it-note{ font-size:1.3em; color:var(--olive); margin-top:.18em; line-height:1.3; }
.wall-foot{
  display:flex; justify-content:space-between; gap:2em; flex:none;
  border-top:.08em solid rgba(114,47,55,.35); padding-top:.9em; margin-top:1em;
  font-size:1.55em; letter-spacing:.1em; color:var(--olive); text-transform:lowercase; white-space:pre;
}
.empty{ font:1.6em var(--mono); color:var(--olive); text-align:center; padding:4em 1em; column-span:all; }

/* ---- take-out trifold ---- */
.page.tri{ flex-direction:row; }
.panel{ width:33.3333%; height:100%; padding:2.8em 2.5em 2.4em; display:flex; flex-direction:column; position:relative; flex:none; }
.fold{ position:absolute; top:0; height:1.4em; border-left:1px solid rgba(107,87,64,.5); }
.fold.b{ top:auto; bottom:0; }
.tri-fit{
  position:absolute;
  top:calc(var(--base) * 2.8px); bottom:calc(var(--base) * 2.4px);
  left:calc(var(--base) * 2.5px); right:calc(var(--base) * 2.5px);
  column-count:3; column-gap:calc(var(--base) * 5px); column-fill:auto; overflow:hidden;
}
.tsec{ margin-bottom:1.4em; }
.tsec-head{
  display:flex; justify-content:space-between; align-items:flex-end; gap:.6em;
  border-bottom:.11em solid var(--ox); padding-bottom:.3em; margin-bottom:.35em;
  break-inside:avoid; break-after:avoid;
}
.tsec-name{ font-family:var(--serif); font-weight:700; color:var(--ox); font-size:1.8em; line-height:1; }
.tsec-src img{ max-height:1.8em; max-width:7.5em; object-fit:contain; }
.tsec-src .mono{ font-size:.66em; letter-spacing:.1em; text-transform:uppercase; color:var(--olive); text-align:right; display:block; line-height:1.25; }
.tsec-blurb{ font-size:.9em; color:var(--olive); margin-bottom:.3em; }
.ti{ display:grid; grid-template-columns:3.2em 1fr auto; column-gap:.65em; align-items:center; break-inside:avoid; padding:.22em 0; }
.ti-ic{ width:3.2em; height:3.2em; display:block; }
.ti-ic svg, .ti-ic img{ width:100%; height:100%; object-fit:contain; }
.ti-name{ font-weight:700; font-size:1.2em; line-height:1.15; }
.ti-note{ font-size:.9em; color:var(--olive); line-height:1.25; margin-top:.1em; }
.ti-price{ font-family:var(--mono); font-weight:500; font-size:1.05em; color:var(--ox); white-space:nowrap; }

.pt-h{ font-family:var(--serif); font-weight:700; color:var(--ox); font-size:2.1em; margin:0 0 .7em; line-height:1; }
.flap p{ font-size:1.15em; line-height:1.55; margin:0 0 1em; }
.notes{ list-style:none; padding:0; margin:.4em 0 0; font-family:var(--mono); font-size:.95em; line-height:1.75; color:var(--ox); }
.notes li{ position:relative; padding-left:1.3em; }
.notes li::before{ content:""; position:absolute; left:.15em; top:.68em; width:.45em; height:.45em; background:var(--amber); transform:rotate(45deg); }
.flap-orn{ margin-top:auto; display:flex; justify-content:center; }
.flap-orn .st8{ width:4em; height:4em; }
.nb{ display:flex; align-items:center; justify-content:space-between; gap:.8em; padding:.7em 0; border-bottom:.08em solid rgba(114,47,55,.18); }
.nb img{ max-height:2.6em; max-width:8em; object-fit:contain; }
.nb-name{ font-weight:700; font-size:1.1em; }
.nb-what{ font-family:var(--mono); font-size:.78em; letter-spacing:.06em; color:var(--olive); text-transform:lowercase; text-align:right; }
.back-foot{ margin-top:auto; font-size:.95em; color:var(--olive); line-height:1.5; display:flex; flex-direction:column; gap:.7em; }
.bf-hours{ color:var(--ox); font-size:.95em; }
.bf-fine{ font-size:.85em; opacity:.85; }
.panel.cover{ padding:0; text-align:center; }
.cv-mid{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.9em; padding:1em 2.5em; }
.cv-name{ display:block; width:100%; white-space:nowrap; overflow:hidden; font-family:var(--serif); font-weight:700; color:var(--ox); line-height:1.08; }
.cv-sub{ font-size:1.1em; letter-spacing:.2em; text-transform:uppercase; color:var(--olive); }
.cv-menu{ font-size:1em; letter-spacing:.3em; color:var(--ox); border:.1em solid var(--ox); padding:.45em 1em; text-transform:uppercase; }
.cv-foot{ padding:0 2.5em 1.3em; font-size:1em; color:var(--olive); line-height:1.45; white-space:pre-line; }

/* ---- stairs sign ---- */
.page.sign-dark{ background:var(--ox); color:var(--cream); }
.sg-wrap{ flex:1; min-height:0; padding:3.5em 6em; display:flex; }
.sg-fit{ flex:1; min-height:0; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
.sg-logo{ margin-bottom:2.2em; }
.sg-logo-tile{ background:var(--cream); padding:1.4em 1.8em; margin-bottom:2.2em; }
.sg-l1{ font-family:var(--serif); font-weight:700; font-size:22em; line-height:.92; white-space:nowrap; }
.sg-l2{ font-size:3.8em; letter-spacing:.34em; text-transform:lowercase; color:var(--sand); margin:.5em 0 .35em; white-space:nowrap; }
.sg-l3{ font-family:var(--serif); font-weight:700; font-size:12.5em; line-height:1; white-space:nowrap; }
.sg-chev{ width:9em; margin:2.6em 0 2.4em; }
.sg-hours{ font-weight:700; font-size:3.8em; line-height:1.3; color:var(--sand); white-space:pre-line; }

/* ---- entry sign ---- */
.ent-top{ display:flex; align-items:center; justify-content:center; gap:.9em; padding-top:3.4em; flex:none; }
.ent-name{ font-family:var(--serif); font-weight:700; font-size:3.4em; color:var(--ox); letter-spacing:.04em; }
.ent-wrap{ flex:1; min-height:0; padding:2em 7em 3em; display:flex; }
.ent-fit{ flex:1; min-height:0; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
.ent-l1{ font-family:var(--serif); font-weight:700; color:var(--ox); font-size:12.5em; line-height:.98; text-wrap:balance; }
.ent-orn{ width:100%; display:flex; align-items:center; gap:1.4em; margin:3.6em 0 3.2em; color:var(--amber); }
.ent-orn i{ flex:1; height:.26em; background:currentColor; opacity:.55; }
.ent-orn .st8{ width:3.4em; height:3.4em; }
.ent-l2{ font-size:3.8em; letter-spacing:.24em; text-transform:lowercase; color:var(--olive); }
.ent-chev{ width:7em; margin:1.5em 0 1.1em; }
.ent-l3{ font-family:var(--serif); font-weight:700; color:var(--teal); font-size:9.5em; line-height:1; text-wrap:balance; }

/* ---------- printing ---------- */
@media print{
  html, body{ height:auto; overflow:visible; background:none; }
  #bar, #panel, .pagecap, #toast{ display:none !important; }
  main{ display:block; height:auto; }
  #stage{ overflow:visible; height:auto; }
  #pages{ display:block; padding:0; }
  .pagebox{ width:auto !important; height:auto !important; box-shadow:none !important; margin:0 !important; break-after:page; page-break-after:always; }
  .pagebox:last-child{ break-after:auto; page-break-after:auto; }
  .pagebox > .page{ position:relative !important; transform:none !important; }
}
</style>
</head>
<body>

<header id="bar">
  <div class="brand" id="brandMark"></div>
  <nav id="docTabs">
    <button data-doc="wall" class="on">wall boards</button>
    <button data-doc="takeout">take-out</button>
    <button data-doc="stairs">stairs sign</button>
    <button data-doc="entry">entry sign</button>
  </nav>
  <div class="bar-r">
    <select id="sizeSel" title="print size"></select>
    <button id="printBtn" class="solid">print / pdf</button>
    <span id="status">loading…</span>
  </div>
</header>

<main>
  <aside id="panel">
    <div class="ptabs">
      <button data-p="menu" class="on">menu items</button>
      <button data-p="words">words, signs + data</button>
    </div>
    <div class="pbody" id="pMenu"></div>
    <div class="pbody" id="pWords" hidden></div>
  </aside>
  <section id="stage"><div id="pages"></div></section>
</main>

<div id="toast"></div>

<script type="module">
/* Firebase loads dynamically so the studio still opens (saving
   to this browser only) if the CDN is blocked or you're offline */
let ref = null, set = null, get = null;

/* ---------------------------
   Persistence — same Firebase project as the old diamond
   editor, new path so nothing old is overwritten.
----------------------------*/
const firebaseConfig = {
  apiKey: "AIzaSyD7a6t76FQj4FBJSObPntecdIypF9lhi_E",
  authDomain: "rotated-square.firebaseapp.com",
  databaseURL: "https://rotated-square-default-rtdb.firebaseio.com",
  projectId: "rotated-square",
  storageBucket: "rotated-square.firebasestorage.app",
  messagingSenderId: "185495802916",
  appId: "1:185495802916:web:54f9c7798477e6b292b4b1"
};
let db = null;
try{
  const [appMod, dbMod] = await Promise.race([
    Promise.all([
      import("https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js")
    ]),
    new Promise((_, rej) => setTimeout(() => rej(new Error("firebase timeout")), 8000))
  ]);
  ({ ref, set, get } = dbMod);
  db = dbMod.getDatabase(appMod.initializeApp(firebaseConfig));
}catch(err){ console.warn("Firebase unavailable — saving to this browser only", err); }

const FB_PATH = "studio/v3";
const LS_KEY  = "gratified-studio-v3";

const $ = s => document.querySelector(s);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);

/* ---------------------------

function asArray(v){ return Array.isArray(v) ? v.filter(Boolean) : (v && typeof v === "object" ? Object.values(v) : []); }

function normalize(d){
  const base = defaults();
  if(!d || typeof d !== "object") return base;
  const out = { ...base, ...d };
  for(const k of ["cafe", "wall", "takeout", "stairs", "entry", "sizes"]) out[k] = { ...base[k], ...(d[k] || {}) };
  out.sections = asArray(d.sections).map(s => ({
    id: s.id || uid(), name: s.name || "Section", supplier: s.supplier || "", board: s.board || "",
    blurb: s.blurb || "", logo: s.logo || "",
    items: asArray(s.items).map(i => ({
      id: i.id || uid(), name: i.name || "", price: i.price || "", note: i.note || "",
      icon: i.icon || "auto", img: i.img || "", onWall: i.onWall !== false
    }))
  }));
  if(!d.sections) out.sections = base.sections;
  return out;
}

function iconOf(it){
  if(it.icon && it.icon !== "auto" && ICONS[it.icon]) return it.icon;
  const n = String(it.name || "").toLowerCase();
  for(const [re, ic] of AUTO) if(re.test(n)) return ic;
  return "star";
}

function hash(s){ let h = 2166136261; for(const c of String(s)){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed){
  let a = seed || 1;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const f1 = n => n.toFixed(1);

function subdiv(pts, step = 9){
  const out = [pts[0]];
  for(let i = 1; i < pts.length; i++){
    const a = pts[i-1], b = pts[i];
    const n = Math.max(1, Math.ceil(Math.hypot(b[0]-a[0], b[1]-a[1]) / step));
    for(let k = 1; k <= n; k++) out.push([a[0] + (b[0]-a[0]) * k/n, a[1] + (b[1]-a[1]) * k/n]);
  }
  return out;
}
function sampleShape(sh){
  if(sh[0] === "l") return { pts: subdiv([[sh[1], sh[2]], [sh[3], sh[4]]]), closed: false };
  if(sh[0] === "p"){
    const closed = !!sh[2];
    return { pts: subdiv(closed ? sh[1].concat([sh[1][0]]) : sh[1]), closed };
  }
  const [, cx, cy, rx, ry, a0 = 0, a1 = 360] = sh;
  const span = a1 - a0;
  const n = Math.max(8, Math.round(span / 14 * Math.max(1, (rx + ry) / 40)));
  const pts = [];
  for(let i = 0; i <= n; i++){
    const a = (a0 + span * i / n) * Math.PI / 180;
    pts.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]);
  }
  return { pts, closed: span >= 360 };
}
function smooth(p){
  let d = `M${f1(p[0][0])} ${f1(p[0][1])}`;
  for(let i = 0; i < p.length - 1; i++){
    const p0 = p[i-1] || p[i], p1 = p[i], p2 = p[i+1], p3 = p[i+2] || p2;
    d += `C${f1(p1[0] + (p2[0]-p0[0])/6)} ${f1(p1[1] + (p2[1]-p0[1])/6)} ${f1(p2[0] - (p3[0]-p1[0])/6)} ${f1(p2[1] - (p3[1]-p1[1])/6)} ${f1(p2[0])} ${f1(p2[1])}`;
  }
  return d;
}

const WASH = [["#D2691E", .30], ["#1F5E5B", .22], ["#E6C89C", .65], ["#CC5500", .22], ["#722F37", .16]];

function scribble(icon, seedStr, stroke = "#2E2B28"){
  const shapes = ICONS[icon] || ICONS.star;
  const r = rng(hash(seedStr + icon));
  const [wc, wo] = WASH[hash(seedStr) % WASH.length];
  let wash = "", lines = "";
  for(const sh of shapes){
    const { pts, closed } = sampleShape(sh);
    let mnx = 1e9, mxx = -1e9, mny = 1e9, mxy = -1e9;
    for(const [x, y] of pts){ mnx = Math.min(mnx, x); mxx = Math.max(mxx, x); mny = Math.min(mny, y); mxy = Math.max(mxy, y); }
    const sizeK = Math.min(1, Math.max(mxx - mnx, mxy - mny) / 30);
    for(let pass = 0; pass < 2; pass++){
      const ox = (r() - .5) * 2.2 * sizeK, oy = (r() - .5) * 2.2 * sizeK;
      const amp = (pass ? 1.6 : 1.1) * sizeK;
      const jp = pts.map(([x, y]) => [x + ox + (r() - .5) * amp * 2, y + oy + (r() - .5) * amp * 2]);
      if(closed && pass === 1 && jp.length > 2) jp.push([jp[1][0] + (r() - .5) * 2, jp[1][1] + (r() - .5) * 2]);
      const d = smooth(jp);
      if(pass === 0 && closed) wash += `<path d="${d}Z" fill="${wc}" fill-opacity="${wo}" transform="translate(2.6 2.4)"/>`;
      lines += `<path d="${d}" fill="none" stroke="${stroke}" stroke-width="${pass ? 1.3 : 2.5}" stroke-opacity="${pass ? .55 : .95}" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
  }
  return `<svg viewBox="-4 -4 110 110" xmlns="http://www.w3.org/2000/svg">${wash}${lines}</svg>`;
}

function art(it){
  return it.img ? `<img src="${it.img}" alt="">` : scribble(iconOf(it), it.id);
}

function star8(c1, c2){
  return `<svg class="st8" viewBox="-50 -50 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect x="-32" y="-32" width="64" height="64" fill="${c1}"/>

const PAL = {
  light: { bg:"#EDE8E0", star:"#722F37", inner:"#E8A317", corner:"#1F5E5B", line:"#722F37" },
  dark:  { bg:"#722F37", star:"#EDE8E0", inner:"#D2691E", corner:"#E6C89C", line:"#E6C89C" },
  teal:  { bg:"#1F5E5B", star:"#EDE8E0", inner:"#E8A317", corner:"#D2691E", line:"#722F37" }
};
let BANDN = 0;
function band(w, h, pal){
  const id = "zl" + (++BANDN);
  const t = h, c = t / 2, a = t * 0.27;
  const corners = [[0,0],[t,0],[0,t],[t,t]].map(([x, y]) =>
    `<rect x="${x - a*.5}" y="${y - a*.5}" width="${a}" height="${a}" fill="${pal.corner}" transform="rotate(45 ${x} ${y})"/>`).join("");
  return `<svg class="band" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <defs><pattern id="${id}" width="${t}" height="${t}" patternUnits="userSpaceOnUse" x="${((w % t) / 2).toFixed(2)}">
      <rect width="${t}" height="${t}" fill="${pal.bg}"/>
      <rect x="${c-a}" y="${c-a}" width="${2*a}" height="${2*a}" fill="${pal.star}"/>
      <rect x="${c-a}" y="${c-a}" width="${2*a}" height="${2*a}" fill="${pal.star}" transform="rotate(45 ${c} ${c})"/>
      <rect x="${c-a*.42}" y="${c-a*.42}" width="${a*.84}" height="${a*.84}" fill="${pal.inner}" transform="rotate(45 ${c} ${c})"/>
      ${corners}
    </pattern></defs>
    <rect width="${w}" height="${h}" fill="url(#${id})"/>
    <rect width="${w}" height="${h*0.06}" fill="${pal.line}"/>
    <rect y="${h*0.94}" width="${w}" height="${h*0.06}" fill="${pal.line}"/>
  </svg>`;
}

function buildWall(key){

    .filter(s => s.board === key)
    .map(s => ({ ...s, items: s.items.filter(i => i.onWall !== false) }))
    .filter(s => s.items.length);
  const weight = secs.reduce((a, s) => a + s.items.length + 2, 0);
  const cols = (weight > 12 || secs.length > 2) ? 2 : 1;

  const body = secs.length ? secs.map(s => `
    <section class="sec">
      <div class="sec-head">
        <span class="sec-name">${star8("#722F37", "#E8A317")}${esc(s.name)}</span>

  return pageOpen("wall", pw, ph, base) + band(pw, base * 2.6, PAL.light) + `

        <div class="wh-top">${logoMark(2.6)}<span class="wh-name">${esc(D.cafe.name)}</span><span class="wh-sub mono">${esc(D.cafe.sub)}</span></div>

        <div class="wh-rule"><i></i>${star8("#722F37", "#E8A317")}<i></i></div>
      </header>

      <footer class="wall-foot mono"><span>${esc(D.wall.footer)}</span><span>${esc(D.cafe.location)} · menu nº ${esc(D.cafe.menuNo)}</span></footer>

function buildTakeout(){
  const { pw, ph } = dims("takeout");
  const base = pw / 100;
  const pnW = pw / 3;
  const secs = D.sections.filter(s => s.items.length);
  const folds = `<i class="fold" style="left:33.333%"></i><i class="fold" style="left:66.666%"></i><i class="fold b" style="left:33.333%"></i><i class="fold b" style="left:66.666%"></i>`;
  const notes = String(D.takeout.notes || "").split("\n").map(x => x.trim()).filter(Boolean);
  const hours = esc(D.cafe.hours).replace(/\n/g, "<br>");

  /* one row per supplier, listing what they make for us */
  const byKey = new Map();
  for(const s of secs){

/* ---------------------------
   Fitting — every .fit box gets the biggest type that fits,
   single display lines shrink to the width they're given.
----------------------------*/
function fitBox(box){
  const kmax = parseFloat(box.dataset.kmax || "1.3"), kmin = 0.3;
  const ok = () => box.scrollHeight <= box.clientHeight + 1 && box.scrollWidth <= box.clientWidth + 1;
  box.style.setProperty("--k", kmax);
  if(ok()) return;
  let lo = kmin, hi = kmax;
  for(let i = 0; i < 10; i++){
    const m = (lo + hi) / 2;
    box.style.setProperty("--k", m);
    if(ok()) lo = m; else hi = m;
  }
  box.style.setProperty("--k", lo);
}
function fitLines(page){
  const base = parseFloat(page.style.getPropertyValue("--base")) || 10;
  page.querySelectorAll("[data-fl]").forEach(el => {
    let px = base * parseFloat(el.dataset.fl);
    el.style.fontSize = px + "px";
    for(let i = 0; i < 4 && el.scrollWidth > el.clientWidth + 1; i++){
      px *= (el.clientWidth / el.scrollWidth) * 0.99;
      el.style.fontSize = px + "px";
    }
  });
}

  ];
  else if(curDoc === "takeout") pages = buildTakeout();

  const el = $("#pages");
  el.innerHTML = pages.map(p => `<div class="pagebox">${p.html}<div class="pagecap">${esc(p.cap)}</div></div>`).join("");
  el.querySelectorAll(".page").forEach(pg => { fitLines(pg); pg.querySelectorAll(".fit").forEach(fitBox); });

function layoutScale(){
  const st = $("#stage");
  const W = st.clientWidth - 56, H = st.clientHeight - 100;
  const boxes = [...document.querySelectorAll(".pagebox")];
  if(!boxes.length) return;
  const first = boxes[0].querySelector(".page");
  const pw = first.offsetWidth, ph = first.offsetHeight;
  let s;
  if(curDoc === "wall") s = Math.min((W - 40) / (2 * pw), H / ph);
  else if(curDoc === "takeout") s = Math.min(W / pw, 1.2);
  else s = Math.min(W / pw, H / ph);
  s = Math.max(0.05, s);
  boxes.forEach(b => {
    const p = b.querySelector(".page");
    b.style.width = p.offsetWidth * s + "px";
    b.style.height = p.offsetHeight * s + "px";
    p.style.transform = `scale(${s})`;
  });
}
window.addEventListener("resize", layoutScale);

/* ---------------------------
   Panel events
----------------------------*/
const panel = $("#panel");

function ctx(t){
  const se = t.closest("[data-sid]"), ie = t.closest("[data-iid]");
  const sec = se ? D.sections.find(s => s.id === se.dataset.sid) : null;
  const item = sec && ie ? sec.items.find(i => i.id === ie.dataset.iid) : null;
  return { sec, item };
}
function touch(){ save(); schedulePreview(); }
function toggle(set, id){ set.has(id) ? set.delete(id) : set.add(id); }
function move(arr, x, d){
  const i = arr.indexOf(x), j = i + d;
  if(i < 0 || j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
}

panel.addEventListener("input", e => {
  const t = e.target;
  if(t.type === "file") return;
  if(t.dataset.k){
    setPath(D, t.dataset.k, t.type === "checkbox" ? t.checked : t.value);
    if(/^wall\.[ab]Title$/.test(t.dataset.k)) renderMenuPanel();
    touch();
    return;
  }
  if(!t.dataset.f) return;
  const { sec, item } = ctx(t);
  const obj = item || sec;
  if(!obj) return;
  obj[t.dataset.f] = t.type === "checkbox" ? t.checked : t.value;
  if(item && (t.dataset.f === "name" || t.dataset.f === "icon")){
    const ic = t.closest(".ir").querySelector(".ir-ic");
    if(ic) ic.innerHTML = art(item);
  }
  touch();
});

panel.addEventListener("click", async e => {
  const pt = e.target.closest(".ptabs button");
  if(pt){
    panel.querySelectorAll(".ptabs button").forEach(b => b.classList.toggle("on", b === pt));
    $("#pMenu").hidden = pt.dataset.p !== "menu";
    $("#pWords").hidden = pt.dataset.p !== "words";
    return;
  }
  const b = e.target.closest("button[data-act]");
  if(!b) return;
  const act = b.dataset.act;
  const { sec, item } = ctx(b);
  switch(act){
    case "toggleSec": toggle(openSecs, sec.id); renderMenuPanel(); return;
    case "toggleItem": toggle(openItems, item.id); renderMenuPanel(); return;
    case "secAdd": { const s = mkSec("New section", "", "", "", []); D.sections.push(s); openSecs.add(s.id); break; }
    case "secUp": move(D.sections, sec, -1); break;
    case "secDown": move(D.sections, sec, 1); break;
    case "secDel":
      if(!confirm(`Delete “${sec.name}” and its ${sec.items.length} items?`)) return;
      D.sections = D.sections.filter(x => x !== sec); break;
    case "secLogoClear": sec.logo = ""; break;
    case "itemAdd": { const i = mkItem("New item", "", ""); sec.items.push(i); openItems.add(i.id); break; }
    case "itemUp": move(sec.items, item, -1); break;
    case "itemDown": move(sec.items, item, 1); break;
    case "itemDel": sec.items = sec.items.filter(x => x !== item); break;
    case "itemImgClear": item.img = ""; break;
    case "cafeLogoClear": D.cafe.logo = ""; renderWordsPanel(); touch(); return;
    case "importLegacy": await importLegacy(); return;
    case "backup": downloadBackup(); return;
    case "reset":
      if(!confirm("Replace everything with the sample menu? (Download a backup first if unsure.)")) return;
      D = defaults(); renderPanels(); touch(); return;
    default: return;
  }
  renderMenuPanel();
  touch();
});

panel.addEventListener("change", async e => {
  const t = e.target;
  const act = t.dataset.act;
  if(!act) return;
  const { sec, item } = ctx(t);
  if(act === "itemMove"){
    const to = D.sections.find(s => s.id === t.value);
    if(to && item && sec){ sec.items = sec.items.filter(x => x !== item); to.items.push(item); openSecs.add(to.id); }
    renderMenuPanel(); touch(); return;
  }
  const file = t.files && t.files[0];
  if(!file) return;
  if(act === "restore"){
    try{
      D = normalize(JSON.parse(await file.text()));
      renderPanels(); touch(); toast("backup restored");
    }catch(err){ alert("That file isn't a menu backup."); }
    return;
  }
  const url = await readImage(file, act === "itemImg" ? 500 : 800);
  if(act === "secLogo" && sec) sec.logo = url;
  else if(act === "itemImg" && item) item.img = url;
  else if(act === "cafeLogo"){ D.cafe.logo = url; renderWordsPanel(); touch(); return; }
  renderMenuPanel(); touch();
});

/* downscale uploads so Firebase stays light; SVGs stay vector */
function readImage(file, max){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = reject;
    fr.onload = () => {
      if(file.type === "image/svg+xml" && file.size < 300000){ resolve(fr.result); return; }
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.naturalWidth || max, img.naturalHeight || max));
        const c = document.createElement("canvas");
        c.width = Math.max(1, Math.round((img.naturalWidth || max) * s));
        c.height = Math.max(1, Math.round((img.naturalHeight || max) * s));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL(file.type === "image/jpeg" ? "image/jpeg" : "image/png", 0.9));
      };
      img.onerror = reject;
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------------------------
   Data utilities
----------------------------*/
async function importLegacy(){
  if(!confirm("Pull every menu from the old diamond editor in as new sections (set to “off wall” so nothing moves until you place them)?")) return;
  let index = [];
  try{
    if(db){ const s = await withTimeout(get(ref(db, "menuIndex")), 6000); if(s.exists()) index = asArray(s.val()); }
  }catch(err){ console.warn(err); }
  if(!index.length){ try{ index = JSON.parse(localStorage.getItem("diamond-menu-index-v1") || "[]"); }catch(err){} }
  if(!index.length){ alert("Couldn't find any old menus."); return; }
  let added = 0;
  for(const m of index){
    let data = null;
    try{ if(db){ const s = await withTimeout(get(ref(db, "menus/" + m.id)), 6000); if(s.exists()) data = s.val(); } }catch(err){}
    if(!data){ try{ data = JSON.parse(localStorage.getItem("diamond-menu-v2:" + m.id) || "null"); }catch(err){} }
    const items = asArray(data && data.items);
    if(!items.length) continue;
    D.sections.push(mkSec(m.name || "Imported", "", "", "", items.map(it => mkItem(it.name || "Item", it.price || "", it.note || ""))));
    added += items.length;
  }
  renderMenuPanel(); touch();
  toast(added ? `imported ${added} items — they're at the bottom of the menu panel` : "old menus were empty");
}

function downloadBackup(){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(D, null, 2)], { type: "application/json" }));
  a.download = `gratified-menu-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
}

let toastT = null;
function toast(msg, ms = 4200){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove("on"), ms);
}

  toast(`print dialog: Save as PDF · Margins: None · Background graphics: on — ${w}"×${h}"`, 7000);
  setTimeout(() => window.print(), 250);
});

$("#brandMark").innerHTML = `<svg width="22" height="22" viewBox="0 0 100 100"><polygon points="50,0 100,50 50,100 0,50" fill="#722F37"/><polygon points="50,30 70,50 50,70 30,50" fill="#E8A317"/></svg><b>Gratified</b><small>menu studio</small>`;

/* ---------------------------
   Boot
----------------------------*/
(async () => {
  D = await loadDoc();
  if(D.sections[0]) openSecs.add(D.sections[0].id);
  renderPanels();
  syncBar();
  renderPreview();
  setStatus(db ? "synced ✓" : "this device only");
  if(document.fonts){
    document.fonts.ready.then(renderPreview);
    document.fonts.addEventListener?.("loadingdone", schedulePreview);
  }
})();
</script>
