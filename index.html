<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rotated Square — Menu Mode</title>

<!-- Fonts: Satoshi (Fontshare) + Bluu Next (CDN Fonts) -->
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,500,700&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/bluu-next" rel="stylesheet">

<style>
:root{
  /* Gratified design tokens */
  --deep-red: #722F37;
  --bright-orange: #CC5500;
  --warm-amber: #D2691E;
  --olive-bronze: #6B5740;
  --cream: #EDE8E0;
  --charcoal: #3C3C3C;
  --golden-sand: #E6C89C;

  --font-price:'Satoshi', system-ui, sans-serif;
  --font-name:'Bluu Next', Georgia, serif;
  --font-note:'Satoshi', system-ui, sans-serif;
}

html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  font-family:'Satoshi', system-ui;
  background:var(--cream);
}

#ui{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:56px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 14px;
  background:var(--cream);
  color:var(--charcoal);
  border-bottom:3px solid var(--deep-red);
  box-shadow:0 4px 20px rgba(114, 47, 55, 0.12);
  z-index:10;
}

#ui::before{
  content:'Gratified';
  font-family:var(--font-name);
  font-weight:700;
  color:var(--deep-red);
  letter-spacing:2px;
  font-size:16px;
  margin-right:6px;
}

input{
  font-size:12px;
  padding:6px 8px;
  font-family:inherit;
  border:2px solid rgba(114, 47, 55, 0.25);
  background:rgba(230, 200, 156, 0.15);
  color:var(--charcoal);
  outline:none;
  transition:border-color 0.3s ease;
}

input:focus{
  border-color:var(--bright-orange);
}

input::placeholder{
  color:var(--olive-bronze);
  opacity:0.6;
  text-transform:lowercase;
  letter-spacing:0.5px;
}

input[type="color"]{
  padding:2px;
  width:36px;
  height:30px;
  cursor:pointer;
}

#swatches{
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 6px;
}

#nibbleLabel{
  display:flex;
  align-items:center;
  gap:5px;
  font-size:12px;
  font-weight:600;
  letter-spacing:1px;
  text-transform:lowercase;
  color:var(--deep-red);
  cursor:pointer;
  user-select:none;
}

#nibbleLabel input{
  accent-color:var(--deep-red);
  cursor:pointer;
  width:14px;
  height:14px;
}

.swatch{
  width:18px;
  height:18px;
  transform:rotate(45deg);
  cursor:pointer;
  border:2px solid rgba(60,60,60,0.2);
  transition:transform 0.25s ease, border-color 0.25s ease;
}

.swatch:hover{
  transform:rotate(45deg) scale(1.2);
  border-color:var(--charcoal);
}

.swatch.current{
  border-color:var(--bright-orange);
}

button{
  font-size:12px;
  font-family:inherit;
  font-weight:600;
  letter-spacing:1px;
  text-transform:lowercase;
  padding:7px 16px;
  border:2px solid var(--deep-red);
  background:transparent;
  color:var(--deep-red);
  cursor:pointer;
  transition:all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

button:hover{
  background:var(--deep-red);
  color:var(--cream);
  letter-spacing:1.5px;
}

#wrap{
  position:absolute;
  inset:56px 0 0 0;
}

svg{
  width:100%;
  height:100%;
  background:var(--cream);
  cursor:grab;
}
svg:active{ cursor:grabbing; }

.item text{
  pointer-events:none;
  user-select:none;
}
</style>
</head>

<body>

<div id="ui">
  <input id="name" placeholder="item name" />
  <input id="price" placeholder="price" />
  <input id="note" placeholder="note" />
  <label id="nibbleLabel"><input type="checkbox" id="nibble"/> nibble</label>
  <div id="swatches" title="brand colors"></div>
  <input type="color" id="color" value="#E6C89C"/>
  <button onclick="addItem()">Add Item</button>
  <button onclick="del()">Delete</button>
  <button onclick="exportSVG()">Export SVG</button>
</div>

<div id="wrap">
<svg id="svg"></svg>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD7a6t76FQj4FBJSObPntecdIypF9lhi_E",
  authDomain: "rotated-square.firebaseapp.com",
  databaseURL: "https://rotated-square-default-rtdb.firebaseio.com",
  projectId: "rotated-square",
  storageBucket: "rotated-square.firebasestorage.app",
  messagingSenderId: "185495802916",
  appId: "1:185495802916:web:54f9c7798477e6b292b4b1"
};

const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);
const menuRef = ref(db, "menus/default");

const svg = document.getElementById("svg");

let state = {
  scale: 40,
  ox: 0,
  oy: 0,
  dragging:false,
  dragStart:null,
  selected:null,
  items:[]
};

/* ---------------------------
   Persistence
   Primary: Firebase Realtime DB
   Fallback/cache: localStorage
   (writes are debounced so wheel
   zoom doesn't spam the network)
----------------------------*/

const STORE_KEY = "diamond-menu-v1";
const SNAPSHOT_VERSION = 2;
let saveTimer = null;

function snapshot(){
  return {
    v: SNAPSHOT_VERSION,
    items: state.items,
    scale: state.scale,
    ox: state.ox,
    oy: state.oy
  };
}

function applySnapshot(data){
  if(!data) return;
  const v = data.v || 1;

  /* migrations:
     v0: items stored as (q,r)        → gx=(q-r)*2, gy=q+r
     v1: gx in full-scale units       → gx*2
     v2: gx AND gy in half-scale units (current — diamonds can sit
         on any half-step intersection, so a one-line diagonal
         nudge is just gx±1, gy±1) */
  state.items = (data.items || []).map(raw=>{
    const it = { ...raw };
    if(it.gx === undefined && it.q !== undefined){
      it.gx = (it.q - it.r) * 2;
      it.gy = it.q + it.r;
      delete it.q; delete it.r;
    }else if(v < 2){
      it.gx = it.gx * 2;
    }
    return it;
  });
  if(typeof data.scale === "number") state.scale = data.scale;
  if(typeof data.ox === "number") state.ox = data.ox;
  if(typeof data.oy === "number") state.oy = data.oy;
}

function save(){
  const data = snapshot();

  // instant local cache
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
  }catch(err){ /* private mode etc. */ }

  // debounced cloud write
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    set(menuRef, data).catch(err=>{
      console.error("Firebase save failed:", err);
    });
  }, 400);
}

async function load(){
  // try cloud first
  try{
    const snap = await get(menuRef);
    if(snap.exists()){
      applySnapshot(snap.val());
      return;
    }
  }catch(err){
    console.error("Firebase load failed, using local cache:", err);
  }

  // fall back to local cache
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) applySnapshot(JSON.parse(raw));
  }catch(err){
    console.error("Local load failed:", err);
  }
}

/* ---------------------------
   Typography (trad layout)
   PRICE (top)   → Satoshi 700
   NAME (middle) → Bluu Next
   NOTE (bottom) → Satoshi 300, lighter
----------------------------*/

const FONT_PRICE = "Satoshi, system-ui, sans-serif";
const FONT_NAME  = "'Bluu Next', Georgia, serif";
const FONT_NOTE  = "Satoshi, system-ui, sans-serif";

/* escape user text so "tea & honey" doesn't break the SVG */
function esc(str){
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

/* ---------------------------
   Diamond-aware text wrapping

   SVG text doesn't wrap on its own, so we measure each word
   with a canvas and break lines ourselves. The trick: the
   max width isn't a box — it follows the diamond's slanted
   edges. At vertical offset dy from the centre, the diamond
   is 2*(S - |dy|) wide, so a line near the middle can run
   nearly the full width and only wraps when it genuinely
   kisses the border. Nibbles wrap against the inner border
   (S * 0.82) instead of the outer one.
----------------------------*/

const measCtx = document.createElement("canvas").getContext("2d");
function textW(text, font){
  measCtx.font = font;
  return measCtx.measureText(text).width;
}

/* wrap `text` where each line's max width depends on its
   vertical position. dyOf(i, n) = offset of line i of n from
   the diamond centre; widthAt(dy) = max width at that offset.
   Line count changes the offsets, so we run to a fixed point. */
function wrapText(text, font, widthAt, dyOf, maxLines){
  const words = String(text || "").trim().split(/\s+/).filter(Boolean);
  if(!words.length) return [];
  let n = 1;
  let lines = [words.join(" ")];
  for(let pass = 0; pass < 5; pass++){
    const out = [];
    let cur = "";
    for(const w of words){
      const li = Math.min(out.length, n - 1);
      const maxW = widthAt(dyOf(li, n));
      const test = cur ? cur + " " + w : w;
      if(cur && textW(test, font) > maxW){
        out.push(cur);
        cur = w;
      }else{
        cur = test;
      }
    }
    if(cur) out.push(cur);
    if(out.length === n){ lines = out; break; }
    n = out.length;
    lines = out;
  }
  // cap the line count: rather than spilling past the diamond's
  // points, fold the remainder onto the last allowed line
  if(maxLines && lines.length > maxLines){
    lines = lines.slice(0, maxLines - 1)
      .concat(lines.slice(maxLines - 1).join(" "));
  }
  return lines;
}

const NAME_FS = 14, NAME_LH = 15;
const NOTE_FS = 9,  NOTE_LH = 11;
const PRICE_FS = 9.5;
const EDGE_PAD = 5; /* how close text may get to the border */

/* trad readability: on dark fills (espresso browns, deep reds)
   flip the text to cream so notes stay legible */
function isDarkFill(hex){
  const c = String(hex || "").replace("#","");
  if(c.length !== 6) return false;
  const r = parseInt(c.slice(0,2),16)/255;
  const g = parseInt(c.slice(2,4),16)/255;
  const b = parseInt(c.slice(4,6),16)/255;
  return (0.2126*r + 0.7152*g + 0.0722*b) < 0.55;
}

/* price (top) / name (middle, vertically centred) / note
   (below name) — all wrapped against the diamond's edges.
   Shared by the live canvas and the export so they match. */
function itemTexts(it, x, y, s){
  const S = it.nibble ? s * 0.82 : s;
  const widthAt = dy => Math.max(10, 2 * (S - Math.abs(dy)) - EDGE_PAD * 2);

  const dark = isDarkFill(it.color);
  const nameCol = dark ? "#EDE8E0" : "#722F37";
  const subCol  = dark ? "#E6C89C" : "#6B5740";
  const subOp   = dark ? 0.95 : 0.85;

  const nameFont = `700 ${NAME_FS}px ${FONT_NAME}`;
  const noteFont = `300 ${NOTE_FS}px ${FONT_NOTE}`;

  // name: block centred on the diamond's widest band (max 3 lines)
  const nameLines = wrapText(it.name, nameFont, widthAt,
    (i, n) => (i - (n - 1) / 2) * NAME_LH, 3);
  const nN = Math.max(1, nameLines.length);
  const nameTop = -((nN - 1) / 2) * NAME_LH - NAME_FS * 0.55;
  const nameBot =  ((nN - 1) / 2) * NAME_LH + NAME_FS * 0.45;

  // note: grows downward from under the name (max 2 lines)
  const noteStart = nameBot + 10;
  const noteLines = wrapText(it.note, noteFont, widthAt,
    (i) => noteStart + i * NOTE_LH - NOTE_FS * 0.35, 2);

  let out = "";

  if(String(it.price || "").trim()){
    out += `
      <text x="${x}" y="${y + nameTop - 5}" text-anchor="middle"
        font-size="${PRICE_FS}" font-weight="500" fill="${subCol}" opacity="${subOp}"
        font-family="${FONT_PRICE}" letter-spacing="1">${esc(it.price)}</text>`;
  }

  nameLines.forEach((ln, i)=>{
    out += `
      <text x="${x}" y="${y + (i - (nN - 1) / 2) * NAME_LH + 5}" text-anchor="middle"
        font-size="${NAME_FS}" font-weight="700" fill="${nameCol}"
        font-family="${FONT_NAME}">${esc(ln)}</text>`;
  });

  noteLines.forEach((ln, i)=>{
    out += `
      <text x="${x}" y="${y + noteStart + i * NOTE_LH}" text-anchor="middle"
        font-size="${NOTE_FS}" font-weight="300" fill="${subCol}" opacity="${subOp}"
        font-family="${FONT_NOTE}">${esc(ln)}</text>`;
  });

  return out;
}

/* ---------------------------
   Diamond coordinate system
   BOTH axes now run in half-scale steps, so every
   intersection — including the midpoint of a lattice
   edge — is placeable. A one-line diagonal move is
   simply (gx±1, gy±1); no more hopping.
----------------------------*/

function toScreen(gx,gy){
  const u = state.scale * 0.5;
  return {
    x: gx * u + state.ox,
    y: gy * u + state.oy
  };
}

function toGrid(x,y){
  const u = state.scale * 0.5;
  return {
    gx: Math.round((x - state.ox) / u),
    gy: Math.round((y - state.oy) / u)
  };
}

/* true when (gx,gy) is a centre of the edge-to-edge
   diamond tiling (the classic lattice look) */
function isLatticeCentre(gx, gy){
  return gx % 2 === 0 && gy % 2 === 0 && ((gx + gy) / 2) % 2 === 0;
}

/* mouse coords → svg-local coords
   (fixes the toolbar-offset drift) */
function svgPoint(e){
  const r = svg.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

/* ---------------------------
   Diamond shape
----------------------------*/

function diamond(x,y,s,fill,stroke){
  return `
    <polygon
      points="${x},${y-s} ${x+s},${y} ${x},${y+s} ${x-s},${y}"
      fill="${fill}"
      stroke="${stroke}"
    />
  `;
}

/* Gratified signature: solid outer border
   + faint inset echo, like the site's
   .section::before / .value-item::before.
   Nibbles: the band between the outer edge
   and the inset line fills solid deep red,
   with a light line marking the boundary. */
function diamondItem(x,y,s,fill,stroke,nibble){
  const si = s*0.82;
  if(nibble){
    return `
      <polygon
        points="${x},${y-s} ${x+s},${y} ${x},${y+s} ${x-s},${y}"
        fill="#722F37"
        stroke="${stroke}"
        stroke-width="1.6"
        stroke-linejoin="round"
      />
      <polygon
        points="${x},${y-si} ${x+si},${y} ${x},${y+si} ${x-si},${y}"
        fill="${fill}"
        stroke="#EDE8E0"
        stroke-width="0.8"
        stroke-linejoin="round"
        opacity="0.9"
      />
    `;
  }
  return `
    <polygon
      points="${x},${y-s} ${x+s},${y} ${x},${y+s} ${x-s},${y}"
      fill="${fill}"
      stroke="${stroke}"
      stroke-width="1.6"
      stroke-linejoin="round"
    />
    <polygon
      points="${x},${y-si} ${x+si},${y} ${x},${y+si} ${x-si},${y}"
      fill="none"
      stroke="${stroke}"
      stroke-width="0.8"
      stroke-linejoin="round"
      opacity="0.35"
    />
  `;
}

/* ---------------------------
   Render menu item
   (price top / name middle / note bottom)
----------------------------*/

function renderItem(it){
  const p = toScreen(it.gx,it.gy);
  const isSel = state.selected === it;

  return `
    <g class="item" data-id="${it.id}">
      ${diamondItem(
        p.x,p.y,
        state.scale,
        it.color,
        isSel ? "#CC5500" : "#722F37",
        it.nibble
      )}
      ${itemTexts(it, p.x, p.y, state.scale)}
    </g>
  `;
}

/* ---------------------------
   Render loop
----------------------------*/

function render(){

  let out = "";

  // grid: computed from the visible viewport so it never runs out when panning
  const w = svg.clientWidth || 800;
  const h = svg.clientHeight || 600;
  const s = state.scale;
  const u = s * 0.5;

  const gx0 = Math.floor((0 - state.ox)/u) - 2;
  const gx1 = Math.ceil((w - state.ox)/u) + 2;
  const gy0 = Math.floor((0 - state.oy)/u) - 2;
  const gy1 = Math.ceil((h - state.oy)/u) + 2;

  const cells = (gx1-gx0)*(gy1-gy0);
  const showDots = u >= 9; // skip the dots when zoomed way out

  if(cells <= 30000){
    for(let gx=gx0; gx<=gx1; gx++){
      for(let gy=gy0; gy<=gy1; gy++){
        const p = toScreen(gx,gy);
        if(isLatticeCentre(gx,gy)){
          // tiling outline (the classic lattice look)
          out += diamond(p.x,p.y,s,"none","rgba(114, 47, 55, 0.08)");
        }
        if(showDots){
          // dot at every placeable centre (now every half-step)
          out += `<circle cx="${p.x}" cy="${p.y}" r="1.2" fill="rgba(114, 47, 55, 0.14)"/>`;
        }
      }
    }
  }

  for(const it of state.items){
    out += renderItem(it);
  }

  svg.innerHTML = out;
}

/* ---------------------------
   Interaction
----------------------------*/

let draggingItem = null;
let dragOffset = {x:0, y:0};

const fName  = document.getElementById("name");
const fPrice = document.getElementById("price");
const fNote  = document.getElementById("note");
const fColor = document.getElementById("color");
const fNibble = document.getElementById("nibble");

function populateFields(it){
  fName.value  = it.name;
  fPrice.value = it.price;
  fNote.value  = it.note;
  fColor.value = it.color;
  fNibble.checked = !!it.nibble;
}

svg.addEventListener("mousedown",(e)=>{

  const g = e.target.closest?.("g");
  const pt = svgPoint(e);

  if(g && g.dataset.id){
    const id = g.dataset.id;
    const it = state.items.find(x=>x.id===id);
    if(it){
      state.selected = it;
      draggingItem = it;
      // remember where inside the diamond you grabbed,
      // so it doesn't jump to centre-on-cursor
      const p = toScreen(it.gx, it.gy);
      dragOffset = { x: p.x - pt.x, y: p.y - pt.y };
      populateFields(it);
      render();
      return;
    }
  }

  // empty canvas: deselect + start panning
  state.selected = null;
  state.dragging = true;
  state.dragStart = {x:e.clientX,y:e.clientY};
  render();
});

window.addEventListener("mousemove",(e)=>{

  if(state.dragging && !draggingItem){
    state.ox += e.clientX - state.dragStart.x;
    state.oy += e.clientY - state.dragStart.y;
    state.dragStart = {x:e.clientX,y:e.clientY};
    render();
  }

  if(draggingItem){
    const pt = svgPoint(e);
    const g = toGrid(pt.x + dragOffset.x, pt.y + dragOffset.y);
    if(g.gx !== draggingItem.gx || g.gy !== draggingItem.gy){
      draggingItem.gx = g.gx;
      draggingItem.gy = g.gy;
      render();
    }
  }
});

/* live edit: typing updates the selected diamond */
function liveEdit(field, input){
  input.addEventListener("input", ()=>{
    if(!state.selected) return;
    state.selected[field] = input.value;
    render();
    save();
  });
}
liveEdit("name",  fName);
liveEdit("price", fPrice);
liveEdit("note",  fNote);
liveEdit("color", fColor);

/* nibble checkbox: live toggle on the selected diamond */
fNibble.addEventListener("change", ()=>{
  if(!state.selected) return;
  state.selected.nibble = fNibble.checked;
  render();
  save();
});

/* ---------------------------
   Brand color swatches
----------------------------*/

const BRAND_COLORS = [
  { name:"deep red",      hex:"#722F37" },
  { name:"bright orange", hex:"#CC5500" },
  { name:"warm amber",    hex:"#D2691E" },
  { name:"olive bronze",  hex:"#6B5740" },
  { name:"golden sand",   hex:"#E6C89C" },
  { name:"cream",         hex:"#EDE8E0" }
];

const swatchBox = document.getElementById("swatches");

for(const c of BRAND_COLORS){
  const el = document.createElement("div");
  el.className = "swatch";
  el.style.background = c.hex;
  el.title = c.name;
  el.addEventListener("click", ()=>{
    fColor.value = c.hex;
    swatchBox.querySelectorAll(".swatch").forEach(s=>s.classList.remove("current"));
    el.classList.add("current");
    if(state.selected){
      state.selected.color = c.hex;
      render();
      save();
    }
  });
  swatchBox.appendChild(el);
}

window.addEventListener("mouseup",()=>{
  if(state.dragging || draggingItem) save();
  state.dragging = false;
  draggingItem = null;
});

window.addEventListener("resize", render);

/* zoom */

svg.addEventListener("wheel",(e)=>{
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.1 : 0.9;
  state.scale = Math.max(10,Math.min(120,state.scale*f));
  render();
  save();
});

/* ---------------------------
   Add menu item
----------------------------*/

function addItem(){

  const centre = toGrid(
    (svg.clientWidth || 800)/2,
    (svg.clientHeight || 600)/2
  );

  const it = {
    id:crypto.randomUUID(),
    gx:centre.gx,
    gy:centre.gy,
    name:fName.value || "Item",
    price:fPrice.value || "$0",
    note:fNote.value || "",
    color:fColor.value,
    nibble:fNibble.checked
  };

  state.items.push(it);
  state.selected = it;

  render();
  save();
}

function del(){
  if(!state.selected) return;
  state.items = state.items.filter(x=>x!==state.selected);
  state.selected=null;
  render();
  save();
}

/* ---------------------------
   Export SVG — the final menu.
   Auto-crops to your diamonds, adds the
   title, brand background washes, and a
   whisper-faint diamond lattice across
   the whole sheet so the composition
   feels of-a-piece.
----------------------------*/

function exportSVG(){

  if(!state.items.length){
    alert("Add some menu items first :)");
    return;
  }

  const s = state.scale;

  // bounds of all diamonds
  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  for(const it of state.items){
    const p = toScreen(it.gx,it.gy);
    minX = Math.min(minX, p.x - s);
    maxX = Math.max(maxX, p.x + s);
    minY = Math.min(minY, p.y - s);
    maxY = Math.max(maxY, p.y + s);
  }

  const pad = 48;
  const headerH = 112;
  const footerH = 60;
  const x0 = minX - pad;
  const y0 = minY - pad - headerH;
  const w  = (maxX - minX) + pad*2;
  const h  = (maxY - minY) + pad*2 + headerH + footerH;
  const cx = (minX + maxX)/2;

  let out = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${x0} ${y0} ${w} ${h}" width="${w}" height="${h}">`;

  out += `
    <style>
      @import url('https://api.fontshare.com/v2/css?f[]=satoshi@300,500,700&amp;display=swap');
      @import url('https://fonts.cdnfonts.com/css/bluu-next');
    </style>

    <defs>
      <radialGradient id="washRed" cx="25%" cy="25%" r="60%">
        <stop offset="0%" stop-color="#722F37" stop-opacity="0.04"/>
        <stop offset="100%" stop-color="#722F37" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="washOrange" cx="75%" cy="75%" r="60%">
        <stop offset="0%" stop-color="#CC5500" stop-opacity="0.03"/>
        <stop offset="100%" stop-color="#CC5500" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="#EDE8E0"/>
    <rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="url(#washRed)"/>
    <rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="url(#washOrange)"/>
  `;

  // ---- whisper lattice across the whole sheet (aligned to the working grid) ----
  {
    const u = s * 0.5;
    const lgx0 = Math.floor((x0 - state.ox)/u) - 1;
    const lgx1 = Math.ceil((x0 + w - state.ox)/u) + 1;
    const lgy0 = Math.floor((y0 - state.oy)/u) - 1;
    const lgy1 = Math.ceil((y0 + h - state.oy)/u) + 1;
    if((lgx1-lgx0)*(lgy1-lgy0) <= 40000){
      for(let gx=lgx0; gx<=lgx1; gx++){
        for(let gy=lgy0; gy<=lgy1; gy++){
          if(isLatticeCentre(gx,gy)){
            const p = toScreen(gx,gy);
            out += `
              <polygon
                points="${p.x},${p.y-s} ${p.x+s},${p.y} ${p.x},${p.y+s} ${p.x-s},${p.y}"
                fill="none" stroke="#722F37" stroke-opacity="0.05" stroke-width="1"
              />`;
          }
        }
      }
    }
  }

  // ---- title ----
  const titleY = y0 + 60;
  out += `
    <text x="${cx}" y="${titleY}" text-anchor="middle"
      font-size="32" font-weight="700" fill="#722F37"
      font-family="${FONT_NAME}" letter-spacing="3">Drinks and nibbles</text>
  `;

  // ---- footer: tax note ----
  const footY = maxY + pad + 28;

  out += `
    <text x="${cx}" y="${footY}" text-anchor="middle"
      font-size="11" font-weight="300" fill="#6B5740" opacity="0.75"
      font-family="${FONT_NOTE}" letter-spacing="0.5">Pricing includes tax. Suggested tip 50&#162;/item.</text>
  `;

  // ---- diamonds with double borders + wrapped text ----
  for(const it of state.items){
    const p = toScreen(it.gx,it.gy);
    out += diamondItem(p.x, p.y, s, it.color, "#722F37", it.nibble);
    out += itemTexts(it, p.x, p.y, s);
  }

  out += `</svg>`;

  const blob = new Blob([out],{type:"image/svg+xml"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "gratified-menu.svg";
  a.click();
}

/* --------------------------- */

// module scope: expose handlers for the toolbar's onclick attributes
window.addItem = addItem;
window.del = del;
window.exportSVG = exportSVG;

render();           // show grid immediately
load().then(render); // then hydrate from Firebase

// re-render once webfonts arrive so text wrapping
// is measured with the real Bluu Next / Satoshi metrics
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(render);
}

</script>

</body>
</html>
