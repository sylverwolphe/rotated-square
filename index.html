<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rotated Square</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:system-ui;
}

#toolbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:50px;
    background:#111;
    color:white;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 12px;
    z-index:10;
}

button{
    padding:6px 12px;
}

canvas{
    display:block;
}
</style>
</head>
<body>

<div id="toolbar">
    <button id="addDiamond">Add Diamond</button>
    <button id="exportSvg">Export SVG</button>
    <input type="color" id="color" value="#e6b800">
</div>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let width,height;

function resize(){
    width=canvas.width=window.innerWidth;
    height=canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

const TILE=40;

let zoom=1;
let offsetX=0;
let offsetY=0;

let draggingCanvas=false;
let lastX=0;
let lastY=0;

let selected=null;

const diamonds=[];

function diamondToScreen(q,r){

    return {
        x:(q-r)*TILE*zoom+width/2+offsetX,
        y:(q+r)*TILE*0.5*zoom+height/2+offsetY
    };
}

function screenToDiamond(x,y){

    const dx=(x-width/2-offsetX)/(TILE*zoom);
    const dy=(y-height/2-offsetY)/(TILE*0.5*zoom);

    const q=(dx+dy)/2;
    const r=(dy-dx)/2;

    return {
        q:Math.round(q),
        r:Math.round(r)
    };
}

function drawDiamond(cx,cy,size,fill,stroke){

    ctx.beginPath();

    ctx.moveTo(cx,cy-size);
    ctx.lineTo(cx+size,cy);
    ctx.lineTo(cx,cy+size);
    ctx.lineTo(cx-size,cy);

    ctx.closePath();

    if(fill){
        ctx.fillStyle=fill;
        ctx.fill();
    }

    ctx.strokeStyle=stroke;
    ctx.stroke();
}

function render(){

    ctx.clearRect(0,0,width,height);

    drawGrid();

    for(const d of diamonds){

        const p=diamondToScreen(d.q,d.r);

        drawDiamond(
            p.x,
            p.y,
            TILE*0.9*zoom,
            d.color,
            d===selected ? "#ff0000" : "#333"
        );

        if(d.text){

            ctx.fillStyle="#000";
            ctx.textAlign="center";
            ctx.textBaseline="middle";
            ctx.font=`${16*zoom}px sans-serif`;

            ctx.fillText(
                d.text,
                p.x,
                p.y
            );
        }
    }

    requestAnimationFrame(render);
}

function drawGrid(){

    const range=50;

    ctx.strokeStyle="#ddd";

    for(let q=-range;q<range;q++){

        for(let r=-range;r<range;r++){

            const p=diamondToScreen(q,r);

            drawDiamond(
                p.x,
                p.y,
                TILE*zoom,
                null,
                "#eee"
            );
        }
    }
}

canvas.addEventListener("mousedown",e=>{

    if(e.button===1){

        draggingCanvas=true;
        lastX=e.clientX;
        lastY=e.clientY;
    }
});

window.addEventListener("mouseup",()=>{

    draggingCanvas=false;
});

window.addEventListener("mousemove",e=>{

    if(!draggingCanvas) return;

    offsetX += e.clientX-lastX;
    offsetY += e.clientY-lastY;

    lastX=e.clientX;
    lastY=e.clientY;
});

canvas.addEventListener("wheel",e=>{

    e.preventDefault();

    const factor=e.deltaY<0 ? 1.1 : 0.9;

    zoom*=factor;

    zoom=Math.max(
        0.2,
        Math.min(5,zoom)
    );
});

canvas.addEventListener("click",e=>{

    const pos=screenToDiamond(
        e.clientX,
        e.clientY
    );

    selected=null;

    for(const d of diamonds){

        if(
            d.q===pos.q &&
            d.r===pos.r
        ){
            selected=d;
            break;
        }
    }
});

document
.getElementById("addDiamond")
.onclick=()=>{

    diamonds.push({

        q:0,
        r:0,
        color:document.getElementById("color").value,
        text:"◆"

    });
};

document
.getElementById("exportSvg")
.onclick=()=>{

    let svg=`
<svg xmlns="http://www.w3.org/2000/svg">
`;

    for(const d of diamonds){

        const p=diamondToScreen(
            d.q,
            d.r
        );

        const s=TILE;

        svg+=`
<polygon
points="
${p.x},${p.y-s}
${p.x+s},${p.y}
${p.x},${p.y+s}
${p.x-s},${p.y}
"
fill="${d.color}"
stroke="black"
/>
`;
    }

    svg+="</svg>";

    const blob=new Blob(
        [svg],
        {type:"image/svg+xml"}
    );

    const a=document.createElement("a");

    a.href=URL.createObjectURL(blob);
    a.download="rotated-square.svg";
    a.click();
};

render();

</script>

</body>
</html>
