<title>Rotated Square — Menu Mode</title>

<style>
:root{
  /* Gratified design tokens */
  --deep-red: #722F37;
  --bright-orange: #CC5500;
  --warm-amber: #D2691E;
  --olive-bronze: #6B5740;
  --cream: #EDE8E0;
  --charcoal: #3C3C3C;
  --golden-sand: #E6C89C;

  --font-price:'Satoshi', system-ui, sans-serif;
  --font-name:'Bluu Next', Georgia, serif;
  --font-note:'Satoshi', system-ui, sans-serif;
}

html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  font-family:'Satoshi', system-ui;
  background:var(--cream);
}

#ui{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:56px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 14px;
  background:var(--cream);
  color:var(--charcoal);
  border-bottom:3px solid var(--deep-red);
  box-shadow:0 4px 20px rgba(114, 47, 55, 0.12);
  z-index:10;
}

#ui::before{
  content:'Gratified';
  font-family:var(--font-name);
  font-weight:700;
  color:var(--deep-red);
  letter-spacing:2px;
  font-size:16px;
  margin-right:6px;
}

input{
  font-size:12px;
  padding:6px 8px;
  font-family:inherit;
  border:2px solid rgba(114, 47, 55, 0.25);
  background:rgba(230, 200, 156, 0.15);
  color:var(--charcoal);
  outline:none;
  transition:border-color 0.3s ease;
}

input:focus{
  border-color:var(--bright-orange);
}

input::placeholder{
  color:var(--olive-bronze);
  opacity:0.6;
  text-transform:lowercase;
  letter-spacing:0.5px;
}

input[type="color"]{
  padding:2px;
  width:36px;
  height:30px;
  cursor:pointer;
}

#swatches{
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 6px;
}

#nibbleLabel, #specialLabel{
  display:flex;
  align-items:center;
  gap:5px;
  font-size:12px;
  font-weight:600;
  letter-spacing:1px;
  text-transform:lowercase;
  color:var(--deep-red);
  cursor:pointer;
  user-select:none;
}

#nibbleLabel input, #specialLabel input{
  accent-color:var(--deep-red);
  cursor:pointer;
  width:14px;
  height:14px;
}

.swatch{
  width:18px;
  height:18px;
  transform:rotate(45deg);
  cursor:pointer;
  border:2px solid rgba(60,60,60,0.2);

}

.swatch:hover{
  transform:rotate(45deg) scale(1.2);
  border-color:var(--charcoal);
}

.swatch.current{

}

  font-family:inherit;
  font-weight:600;

  background:transparent;
  color:var(--deep-red);

  transition:all 0.4s cubic-bezier(0.4, 0, 0.2, 1);

button:hover{
  background:var(--deep-red);
  color:var(--cream);

}

.dropdown{
  position:relative;
}

.dropdown-menu{
  position:fixed;
  min-width:180px;
  flex-direction:column;
  background:var(--cream);
  border:2px solid var(--deep-red);
  box-shadow:0 10px 24px rgba(114, 47, 55, 0.18);

.dropdown-menu.open{
  display:flex;
}

.dropdown-item{
  padding:9px 14px;
  font-size:12px;
  font-weight:600;
  letter-spacing:1px;
  text-transform:lowercase;
  color:var(--deep-red);
  cursor:pointer;
  white-space:nowrap;
  transition:background 0.2s ease, color 0.2s ease;
}

.dropdown-item:hover{
  background:var(--deep-red);
  color:var(--cream);
}

.dropdown-item + .dropdown-item{
  border-top:1px solid rgba(114, 47, 55, 0.15);
}

.zoom-group{
  display:flex;
  align-items:center;
  gap:5px;
}

button.zoom-btn{
  padding:6px 11px;
  line-height:1;
}

#zoomInput{
  width:44px;
  text-align:center;
  padding:6px 4px;
  -moz-appearance:textfield;
}

#zoomInput::-webkit-outer-spin-button,
#zoomInput::-webkit-inner-spin-button{

/* ---------------------------
   Menu tabs — one design per tab
   (single-click switch, double-click
   rename, × to delete)
----------------------------*/

#tabs{
  position:fixed;
  top:56px;
  left:0;
  right:0;
  height:36px;
  display:flex;
  align-items:stretch;
  padding:0 14px;
  background:rgba(230, 200, 156, 0.22);
  border-bottom:1px solid rgba(114, 47, 55, 0.2);
  overflow-x:auto;
  z-index:10;
}

#tabList{
  display:flex;
  align-items:stretch;
}

.tab{
  display:flex;
  align-items:center;
  gap:7px;
  padding:0 14px;
  font-size:12px;
  letter-spacing:1px;
  text-transform:lowercase;
  color:var(--olive-bronze);
  cursor:pointer;
  user-select:none;
  white-space:nowrap;
  border-right:1px solid rgba(114, 47, 55, 0.12);
  transition:background 0.25s ease, color 0.25s ease;
}

.tab:hover{
  color:var(--deep-red);
  background:rgba(114, 47, 55, 0.05);
}

.tab.active{
  color:var(--deep-red);
  font-weight:700;
  background:var(--cream);
  box-shadow:inset 0 -3px 0 var(--deep-red);
}

.tab-close{
  opacity:0;
  font-size:14px;
  line-height:1;
  padding:1px 3px;
  transition:opacity 0.2s ease;
}

.tab:hover .tab-close{ opacity:0.55; }
.tab-close:hover{ opacity:1 !important; color:var(--bright-orange); }

#newTab{
  border:none;
  background:transparent;
  color:var(--deep-red);
  font-size:16px;
  font-weight:700;
  padding:0 12px;
  cursor:pointer;
}

#newTab:hover{
  background:rgba(114, 47, 55, 0.08);
  color:var(--deep-red);
  letter-spacing:1px;
}

#wrap{
  position:absolute;
  inset:92px 0 0 0;
}

svg{
  width:100%;
  height:100%;
  background:var(--cream);
  cursor:grab;
}
svg:active{ cursor:grabbing; }

.item text{
  pointer-events:none;
  user-select:none;
}

<body>

<div id="ui">
  <input id="name" placeholder="item name" />

  </div>

<svg id="svg"></svg>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD7a6t76FQj4FBJSObPntecdIypF9lhi_E",
  authDomain: "rotated-square.firebaseapp.com",
  databaseURL: "https://rotated-square-default-rtdb.firebaseio.com",
  projectId: "rotated-square",
  storageBucket: "rotated-square.firebasestorage.app",
  messagingSenderId: "185495802916",
  appId: "1:185495802916:web:54f9c7798477e6b292b4b1"
};

const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);

const svg = document.getElementById("svg");

let state = {
  scale: 40,
  ox: 0,
  oy: 0,
  dragging:false,
  dragStart:null,
  selected:null,
  items:[]
};

/* ---------------------------
   Persistence — multi-menu tabs

   menuIndex (cloud node "menuIndex",
   local key INDEX_KEY) lists the tabs:
   [{id, name}]. Each menu's data lives
   at menus/{id} in Firebase, mirrored
   to localStorage per-id.

   Your original single menu at
   menus/default is adopted as the
   first tab on first run — nothing
   is lost.
----------------------------*/

const STORE_PREFIX = "diamond-menu-v2:";
const LEGACY_STORE_KEY = "diamond-menu-v1"; // pre-tabs local cache
const INDEX_KEY = "diamond-menu-index-v1";
const SNAPSHOT_VERSION = 2;
let saveTimer = null;

let menuIndex = [];      // [{id, name}]
let currentMenuId = null;

const menuRef = id => ref(db, "menus/" + id);
const indexRef = ref(db, "menuIndex");

function snapshot(){
  return {
    v: SNAPSHOT_VERSION,
    items: state.items,
    scale: state.scale,
    ox: state.ox,
    oy: state.oy
  };
}

function applySnapshot(data){
  if(!data) return;
  const v = data.v || 1;

  /* migrations:
     v0: items stored as (q,r)        → gx=(q-r)*2, gy=q+r
     v1: gx in full-scale units       → gx*2
     v2: gx AND gy in half-scale units (current — diamonds can sit
         on any half-step intersection, so a one-line diagonal
         nudge is just gx±1, gy±1) */
  state.items = (data.items || []).map(raw=>{
    const it = { ...raw };
    if(it.gx === undefined && it.q !== undefined){
      it.gx = (it.q - it.r) * 2;
      it.gy = it.q + it.r;
      delete it.q; delete it.r;
    }else if(v < 2){
      it.gx = it.gx * 2;
    }
    return it;
  });
  if(typeof data.scale === "number") state.scale = data.scale;
  if(typeof data.ox === "number") state.ox = data.ox;
  if(typeof data.oy === "number") state.oy = data.oy;
  syncZoomInput();
}

function save(){
  if(!currentMenuId) return;
  const data = snapshot();
  const id = currentMenuId;

  // instant local cache
  try{
    localStorage.setItem(STORE_PREFIX + id, JSON.stringify(data));
  }catch(err){ /* private mode etc. */ }

  // debounced cloud write
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    set(menuRef(id), data).catch(err=>{
      console.error("Firebase save failed:", err);
    });
  }, 400);
}

/* immediate save (no debounce) — used right before
   switching tabs so nothing in-flight is lost */
function flushSave(){
  if(!currentMenuId) return;
  clearTimeout(saveTimer);
  const data = snapshot();
  try{
    localStorage.setItem(STORE_PREFIX + currentMenuId, JSON.stringify(data));
  }catch(err){}
  set(menuRef(currentMenuId), data).catch(err=>{
    console.error("Firebase save failed:", err);
  });
}

function saveIndex(){
  try{
    localStorage.setItem(INDEX_KEY, JSON.stringify(menuIndex));
  }catch(err){}
  set(indexRef, menuIndex).catch(err=>{
    console.error("Firebase index save failed:", err);
  });
}

async function loadIndex(){
  // try cloud first
  try{
    const snap = await get(indexRef);
    if(snap.exists()){
      const v = snap.val();
      menuIndex = Array.isArray(v) ? v.filter(Boolean) : Object.values(v);
      if(menuIndex.length) return;
    }
  }catch(err){
    console.error("Firebase index load failed, trying local:", err);
  }

  // fall back to local cache
  try{
    const raw = localStorage.getItem(INDEX_KEY);
    if(raw){
      menuIndex = JSON.parse(raw);
      if(menuIndex.length) return;
    }
  }catch(err){}

  // first run on the tab scheme: adopt the original single
  // menu (menus/default) as tab #1 so existing work carries over
  menuIndex = [{ id:"default", name:"Drinks and nibbles" }];
  saveIndex();
}

async function loadMenu(id){
  state.items = [];
  state.selected = null;

  // try cloud first
  try{
    const snap = await get(menuRef(id));
    if(snap.exists()){
      applySnapshot(snap.val());
      return;
    }
  }catch(err){
    console.error("Firebase load failed, using local cache:", err);
  }

  // fall back to local cache (incl. the pre-tabs key for "default")
  try{
    const raw = localStorage.getItem(STORE_PREFIX + id) ||
                (id === "default" ? localStorage.getItem(LEGACY_STORE_KEY) : null);
    if(raw) applySnapshot(JSON.parse(raw));
  }catch(err){
    console.error("Local load failed:", err);
  }
}

/* ---------------------------
   Tab bar
----------------------------*/

const tabList = document.getElementById("tabList");

function currentMenuName(){
  const m = menuIndex.find(t=>t.id===currentMenuId);
  return m ? m.name : "Menu";
}

function renderTabs(){
  tabList.innerHTML = "";
  for(const m of menuIndex){
    const el = document.createElement("div");
    el.className = "tab" + (m.id === currentMenuId ? " active" : "");
    el.title = "click to open · double-click to rename";

    const lbl = document.createElement("span");
    lbl.textContent = m.name;
    el.appendChild(lbl);

    const x = document.createElement("span");
    x.className = "tab-close";
    x.textContent = "\u00d7";
    x.title = "delete menu";
    el.appendChild(x);

    el.addEventListener("click", (e)=>{
      if(e.target === x) return;
      switchMenu(m.id);
    });

    el.addEventListener("dblclick", ()=>{
      const name = prompt("Rename menu:", m.name);
      if(name && name.trim()){
        m.name = name.trim();
        saveIndex();
        renderTabs();
      }
    });

    x.addEventListener("click", (e)=>{
      e.stopPropagation();
      deleteMenu(m.id);
    });

    tabList.appendChild(el);
  }
}

async function switchMenu(id){
  if(id === currentMenuId) return;
  flushSave();
  currentMenuId = id;
  renderTabs();
  await loadMenu(id);
  render();
}

function newMenu(){
  flushSave();
  const id = crypto.randomUUID();
  const name = prompt("Name the new menu:", "Menu " + (menuIndex.length + 1));
  if(name === null) return; // cancelled
  menuIndex.push({ id, name: (name.trim() || "Menu " + menuIndex.length) });
  saveIndex();

  currentMenuId = id;
  state.items = [];
  state.selected = null;
  renderTabs();
  render();
  save(); // create the empty cloud record
}

function deleteMenu(id){
  const m = menuIndex.find(t=>t.id===id);
  if(!m) return;
  if(menuIndex.length <= 1){
    alert("Can't delete the last menu — make a new one first.");
    return;
  }
  if(!confirm(`Delete "${m.name}"? This can't be undone.`)) return;

  menuIndex = menuIndex.filter(t=>t.id!==id);
  saveIndex();

  try{ localStorage.removeItem(STORE_PREFIX + id); }catch(err){}
  set(menuRef(id), null).catch(()=>{});

  if(currentMenuId === id){
    currentMenuId = null;
    switchMenu(menuIndex[0].id);
  }else{
    renderTabs();
  }
}

document.getElementById("newTab").addEventListener("click", newMenu);

/* ---------------------------
   Typography (trad layout)
   PRICE (top)   → Satoshi 700
   NAME (middle) → Bluu Next
   NOTE (bottom) → Satoshi 300, lighter
----------------------------*/

const FONT_PRICE = "Satoshi, system-ui, sans-serif";
const FONT_NAME  = "'Bluu Next', Georgia, serif";
const FONT_NOTE  = "Satoshi, system-ui, sans-serif";

const TAGLINE_TEXT = "hot or iced &#160;//&#160; dairy or oat";
const FOOTER_TEXT  = "prices include tax &#160;//&#160; suggested 50&#162; tip";

/* escape user text so "tea & honey" doesn't break the SVG */
function esc(str){
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

/* ---------------------------
   Diamond-aware text wrapping

   SVG text doesn't wrap on its own, so we measure each word
   with a canvas and break lines ourselves. The trick: the
   max width isn't a box — it follows the diamond's slanted
   edges. At vertical offset dy from the centre, the diamond
   is 2*(S - |dy|) wide, so a line near the middle can run
   nearly the full width and only wraps when it genuinely
   kisses the border. Nibbles wrap against the inner border
   (S * 0.82) instead of the outer one.
----------------------------*/

const measCtx = document.createElement("canvas").getContext("2d");
function textW(text, font){
  measCtx.font = font;
  return measCtx.measureText(text).width;
}

/* wrap `text` where each line's max width depends on its
   vertical position. dyOf(i, n) = offset of line i of n from
   the diamond centre; widthAt(dy) = max width at that offset.
   Line count changes the offsets, so we run to a fixed point. */
function wrapText(text, font, widthAt, dyOf, maxLines){
  const words = String(text || "").trim().split(/\s+/).filter(Boolean);
  if(!words.length) return [];
  let n = 1;
  let lines = [words.join(" ")];
  for(let pass = 0; pass < 5; pass++){
    const out = [];
    let cur = "";
    for(const w of words){
      const li = Math.min(out.length, n - 1);
      const maxW = widthAt(dyOf(li, n));
      const test = cur ? cur + " " + w : w;
      if(cur && textW(test, font) > maxW){
        out.push(cur);
        cur = w;
      }else{
        cur = test;
      }
    }
    if(cur) out.push(cur);
    if(out.length === n){ lines = out; break; }
    n = out.length;
    lines = out;
  }
  // cap the line count: rather than spilling past the diamond's
  // points, fold the remainder onto the last allowed line
  if(maxLines && lines.length > maxLines){
    lines = lines.slice(0, maxLines - 1)
      .concat(lines.slice(maxLines - 1).join(" "));
  }
  return lines;
}

/* shrink a single line of text to fit a max pixel width by
   scaling font-size down proportionally. The menu export's
   canvas auto-sizes to its content, so its title never
   overflows — but the sign export's page width is fixed, and
   tab names vary a lot in length, so its headline needs this. */
function fitSingleLine(text, weight, family, baseSize, maxW){
  const w = textW(String(text || ""), `${weight} ${baseSize}px ${family}`);
  if(!w || w <= maxW) return baseSize;
  return Math.max(26, baseSize * maxW / w);
}

const NAME_FS = 14, NAME_LH = 15;
const NOTE_FS = 9,  NOTE_LH = 11;
const PRICE_FS = 9.5;
const EDGE_PAD = 5; /* how close text may get to the border */

/* trad readability: on dark fills (espresso browns, deep reds)
   flip the text to cream so notes stay legible */
function isDarkFill(hex){
  const c = String(hex || "").replace("#","");
  if(c.length !== 6) return false;
  const r = parseInt(c.slice(0,2),16)/255;
  const g = parseInt(c.slice(2,4),16)/255;
  const b = parseInt(c.slice(4,6),16)/255;
  return (0.2126*r + 0.7152*g + 0.0722*b) < 0.55;
}

/* price (top) / name (middle, vertically centred) / note
   (below name) — all wrapped against the diamond's edges.
   Shared by the live canvas and the export so they match. */
function itemTexts(it, x, y, s){
  const S = it.nibble ? s * 0.82 : s;
  const widthAt = dy => Math.max(10, 2 * (S - Math.abs(dy)) - EDGE_PAD * 2);

  const dark = isDarkFill(it.color);
  const nameCol = dark ? "#EDE8E0" : "#722F37";
  const subCol  = dark ? "#E6C89C" : "#6B5740";
  const subOp   = dark ? 0.95 : 0.85;

  const nameFont = `700 ${NAME_FS}px ${FONT_NAME}`;
  const noteFont = `300 ${NOTE_FS}px ${FONT_NOTE}`;

  // name: block centred on the diamond's widest band (max 3 lines)
  const nameLines = wrapText(it.name, nameFont, widthAt,
    (i, n) => (i - (n - 1) / 2) * NAME_LH, 3);
  const nN = Math.max(1, nameLines.length);
  const nameTop = -((nN - 1) / 2) * NAME_LH - NAME_FS * 0.55;
  const nameBot =  ((nN - 1) / 2) * NAME_LH + NAME_FS * 0.45;

  // note: grows downward from under the name (max 2 lines)
  const noteStart = nameBot + 10;
  const noteLines = wrapText(it.note, noteFont, widthAt,
    (i) => noteStart + i * NOTE_LH - NOTE_FS * 0.35, 2);

  let out = "";

  if(String(it.price || "").trim()){
    out += `
      <text x="${x}" y="${y + nameTop - 9}" text-anchor="middle"
        font-size="${PRICE_FS}" font-weight="500" fill="${subCol}" opacity="${subOp}"
        font-family="${FONT_PRICE}" letter-spacing="1">${esc(it.price)}</text>`;
  }

  nameLines.forEach((ln, i)=>{
    out += `
      <text x="${x}" y="${y + (i - (nN - 1) / 2) * NAME_LH + 5}" text-anchor="middle"
        font-size="${NAME_FS}" font-weight="700" fill="${nameCol}"
        font-family="${FONT_NAME}">${esc(ln)}</text>`;
  });

  noteLines.forEach((ln, i)=>{
    out += `
      <text x="${x}" y="${y + noteStart + i * NOTE_LH}" text-anchor="middle"
        font-size="${NOTE_FS}" font-weight="300" fill="${subCol}" opacity="${subOp}"
        font-family="${FONT_NOTE}">${esc(ln)}</text>`;
  });

  return out;
}

/* ---------------------------
   "Special" treatment — a chill,
   half-opacity sprinkle of whole-food
   glyphs (carrots, beets, sunflowers)
   scattered inside the diamond, under
   the text. Seeded by item id so the
   scatter is stable across renders
   and exports.
----------------------------*/

function hashStr(str){
  let h = 2166136261;
  for(const c of String(str)){
    h ^= c.charCodeAt(0);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function glyphCarrot(x,y,rot){
  return `<g transform="translate(${x},${y}) rotate(${rot})">
    <polygon points="-2.2,-4 2.2,-4 0,5.4" fill="#CC5500"/>
    <line x1="0" y1="-4" x2="0" y2="-6.8" stroke="#5E7A3A" stroke-width="1.4"/>
  </g>`;
}

function glyphBeet(x,y,rot){
  return `<g transform="translate(${x},${y}) rotate(${rot})">
    <path d="M0,-2.4 C3.4,-2.4 3.6,1.2 0,5 C-3.6,1.2 -3.4,-2.4 0,-2.4 Z" fill="#8A2E4F"/>
    <line x1="0" y1="-2.4" x2="-1.8" y2="-6" stroke="#5E7A3A" stroke-width="1.3"/>
    <line x1="0" y1="-2.4" x2="1.6" y2="-6" stroke="#5E7A3A" stroke-width="1.3"/>
  </g>`;
}

function glyphSunflower(x,y){
  let out = "";
  for(let a = 0; a < 360; a += 45){
    const r = a * Math.PI / 180;
    out += `<circle cx="${x + Math.cos(r)*4}" cy="${y + Math.sin(r)*4}" r="1.6" fill="#E6B84C"/>`;
  }
  return out + `<circle cx="${x}" cy="${y}" r="2.2" fill="#6B4A1E"/>`;
}

function specialPattern(it, x, y, s){
  if(!it.special) return "";
  const Si = (it.nibble ? s * 0.82 : s) - 9;
  if(Si < 22) return "";

  /* regular diamond lattice of glyphs: positions are an even
     grid (uniform coverage corner to corner). Species follow a
     3-coloring of the lattice — (a + 2b) mod 3 in diagonal
     coordinates — which guarantees every glyph's nearest
     neighbours are the other two species: no two beets can
     ever sit together. Tilt is hashed per point for a
     hand-placed feel. Fully deterministic. */
  const h = 18;
  const N = Math.ceil(Si / h);
  const off = hashStr(it.id || "") % 3; // rotate the colouring per item
  let g = `<g opacity="0.5">`;
  for(let j = -N; j <= N; j++){
    for(let i = -N; i <= N; i++){
      if((i + j) % 2 !== 0) continue;                  // diamond lattice
      const dx = i * h, dy = j * h;
      if(Math.abs(dx) + Math.abs(dy) > Si * 0.9) continue; // stay inside
      const a = (i + j) / 2, b = (i - j) / 2;
      const kind = ((a + 2 * b) % 3 + 3 + off) % 3;
      const hsh = hashStr(i + "," + j + "," + (it.id || ""));
      const tilt = ((hsh >> 3) % 2 ? 1 : -1) * (8 + (hsh >> 5) % 12);
      const gx = x + dx, gy = y + dy;
      if(kind === 0)      g += glyphCarrot(gx, gy, tilt);
      else if(kind === 1) g += glyphBeet(gx, gy, tilt);
      else                g += glyphSunflower(gx, gy);
    }
  }
  return g + `</g>`;
}

/* ---------------------------
   Diamond coordinate system
   BOTH axes now run in half-scale steps, so every
   intersection — including the midpoint of a lattice
   edge — is placeable. A one-line diagonal move is
   simply (gx±1, gy±1); no more hopping.
----------------------------*/

function toScreen(gx,gy){
  const u = state.scale * 0.5;
  return {
    x: gx * u + state.ox,
    y: gy * u + state.oy
  };
}

function toGrid(x,y){
  const u = state.scale * 0.5;
  return {
    gx: Math.round((x - state.ox) / u),
    gy: Math.round((y - state.oy) / u)
  };
}

/* true when (gx,gy) is a centre of the edge-to-edge
   diamond tiling (the classic lattice look) */
function isLatticeCentre(gx, gy){
  return gx % 2 === 0 && gy % 2 === 0 && ((gx + gy) / 2) % 2 === 0;
}

/* mouse coords → svg-local coords
   (fixes the toolbar-offset drift) */
function svgPoint(e){
  const r = svg.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

/* ---------------------------
   Diamond shape
----------------------------*/

function diamond(x,y,s,fill,stroke){
  return `
    <polygon
      points="${x},${y-s} ${x+s},${y} ${x},${y+s} ${x-s},${y}"
      fill="${fill}"
      stroke="${stroke}"
    />
  `;
}

/* Gratified signature: a single solid outer border in deep
   red (or orange when selected). Nibbles get a deep-red band
   around a smaller inner diamond in the item's own colour —
   the colour change alone marks the boundary, so no inset
   line is needed (it used to read as a stray white/pale ring
   on most fills, light or dark, so it's gone for good). */
function diamondItem(x,y,s,fill,stroke,nibble){
  const si = s*0.82;
  if(nibble){
    return `
      <polygon
        points="${x},${y-s} ${x+s},${y} ${x},${y+s} ${x-s},${y}"
        fill="#722F37"
        stroke="${stroke}"
        stroke-width="1.6"
        stroke-linejoin="round"
      />
      <polygon
        points="${x},${y-si} ${x+si},${y} ${x},${y+si} ${x-si},${y}"
        fill="${fill}"
      />
    `;
  }
  return `
    <polygon
      points="${x},${y-s} ${x+s},${y} ${x},${y+s} ${x-s},${y}"
      fill="${fill}"
      stroke="${stroke}"
      stroke-width="1.6"
      stroke-linejoin="round"
    />
  `;
}

/* ---------------------------
   Render menu item
   (price top / name middle / note bottom)
----------------------------*/

function renderItem(it){
  const p = toScreen(it.gx,it.gy);
  const isSel = state.selected === it;

  return `
    <g class="item" data-id="${it.id}">
      ${diamondItem(
        p.x,p.y,
        state.scale,
        it.color,
        isSel ? "#CC5500" : "#722F37",
        it.nibble
      )}
      ${specialPattern(it, p.x, p.y, state.scale)}
      ${itemTexts(it, p.x, p.y, state.scale)}
    </g>
  `;
}

/* ---------------------------
   Render loop
----------------------------*/

function render(){

  let out = "";

  // grid: computed from the visible viewport so it never runs out when panning
  const w = svg.clientWidth || 800;
  const h = svg.clientHeight || 600;
  const s = state.scale;
  const u = s * 0.5;

  const gx0 = Math.floor((0 - state.ox)/u) - 2;
  const gx1 = Math.ceil((w - state.ox)/u) + 2;
  const gy0 = Math.floor((0 - state.oy)/u) - 2;
  const gy1 = Math.ceil((h - state.oy)/u) + 2;

  const cells = (gx1-gx0)*(gy1-gy0);
  const showDots = u >= 9; // skip the dots when zoomed way out

  if(cells <= 30000){
    for(let gx=gx0; gx<=gx1; gx++){
      for(let gy=gy0; gy<=gy1; gy++){
        const p = toScreen(gx,gy);
        if(isLatticeCentre(gx,gy)){
          // tiling outline (the classic lattice look)
          out += diamond(p.x,p.y,s,"none","rgba(114, 47, 55, 0.08)");
        }
        if(showDots){
          // dot at every placeable centre (now every half-step)
          out += `<circle cx="${p.x}" cy="${p.y}" r="1.2" fill="rgba(114, 47, 55, 0.14)"/>`;
        }
      }
    }
  }

  for(const it of state.items){
    out += renderItem(it);
  }

  svg.innerHTML = out;
}

/* ---------------------------
   Interaction
----------------------------*/

let draggingItem = null;
let dragOffset = {x:0, y:0};

const fName  = document.getElementById("name");
const fPrice = document.getElementById("price");
const fNote  = document.getElementById("note");
const fColor = document.getElementById("color");
const fNibble = document.getElementById("nibble");
const fSpecial = document.getElementById("special");

function populateFields(it){
  fName.value  = it.name;
  fPrice.value = it.price;
  fNote.value  = it.note;
  fColor.value = it.color;
  fNibble.checked = !!it.nibble;
  fSpecial.checked = !!it.special;
}

svg.addEventListener("mousedown",(e)=>{

  const g = e.target.closest?.("g");
  const pt = svgPoint(e);

  if(g && g.dataset.id){
    const id = g.dataset.id;
    const it = state.items.find(x=>x.id===id);
    if(it){
      state.selected = it;
      draggingItem = it;
      // remember where inside the diamond you grabbed,
      // so it doesn't jump to centre-on-cursor
      const p = toScreen(it.gx, it.gy);
      dragOffset = { x: p.x - pt.x, y: p.y - pt.y };
      populateFields(it);
      render();
      return;
    }
  }

  // empty canvas: deselect + start panning
  state.selected = null;
  state.dragging = true;
  state.dragStart = {x:e.clientX,y:e.clientY};
  render();
});

window.addEventListener("mousemove",(e)=>{

  if(state.dragging && !draggingItem){
    state.ox += e.clientX - state.dragStart.x;
    state.oy += e.clientY - state.dragStart.y;
    state.dragStart = {x:e.clientX,y:e.clientY};
    render();
  }

  if(draggingItem){
    const pt = svgPoint(e);
    const g = toGrid(pt.x + dragOffset.x, pt.y + dragOffset.y);
    if(g.gx !== draggingItem.gx || g.gy !== draggingItem.gy){
      draggingItem.gx = g.gx;
      draggingItem.gy = g.gy;
      render();
    }
  }
});

/* live edit: typing updates the selected diamond */
function liveEdit(field, input){
  input.addEventListener("input", ()=>{
    if(!state.selected) return;
    state.selected[field] = input.value;
    render();
    save();
  });
}
liveEdit("name",  fName);
liveEdit("price", fPrice);
liveEdit("note",  fNote);
liveEdit("color", fColor);

/* nibble + special checkboxes: live toggle on the selected diamond */
fNibble.addEventListener("change", ()=>{
  if(!state.selected) return;
  state.selected.nibble = fNibble.checked;
  render();
  save();
});

fSpecial.addEventListener("change", ()=>{
  if(!state.selected) return;
  state.selected.special = fSpecial.checked;
  render();
  save();
});

/* ---------------------------
   Zoom — the wheel is good for quick adjustments; the
   toolbar's −/+ buttons and % field are for precise ones.
   All three funnel through setScale() so they can't drift
   out of sync with each other.
----------------------------*/

const SCALE_MIN = 10, SCALE_MAX = 120, SCALE_BASE = 40; // SCALE_BASE == 100%
const ZOOM_STEP_PCT = 10;

const zoomInput = document.getElementById("zoomInput");
const zoomOutBtn = document.getElementById("zoomOut");
const zoomInBtn = document.getElementById("zoomIn");

function scaleToPct(sc){ return Math.round(sc / SCALE_BASE * 100); }
function pctToScale(pct){ return pct / 100 * SCALE_BASE; }

/* keep the toolbar field showing whatever state.scale actually
   is — called after any zoom action, and after loading a menu
   (which can carry its own saved scale) */
function syncZoomInput(){
  zoomInput.value = scaleToPct(state.scale);
}

function setScale(newScale){
  state.scale = Math.max(SCALE_MIN, Math.min(SCALE_MAX, newScale));
  syncZoomInput();
  render();
  save();
}

zoomOutBtn.addEventListener("click", ()=>{
  setScale(pctToScale(scaleToPct(state.scale) - ZOOM_STEP_PCT));
});

zoomInBtn.addEventListener("click", ()=>{
  setScale(pctToScale(scaleToPct(state.scale) + ZOOM_STEP_PCT));
});

/* "change" (not "input") so it commits on blur/Enter rather
   than re-rendering on every keystroke */
zoomInput.addEventListener("change", ()=>{
  const pct = parseFloat(zoomInput.value);
  if(Number.isFinite(pct)) setScale(pctToScale(pct));
  else syncZoomInput();
});

zoomInput.addEventListener("keydown", (e)=>{
  if(e.key === "Enter") zoomInput.blur();
});

svg.addEventListener("wheel",(e)=>{
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.1 : 0.9;
  setScale(state.scale * f);
});

/* ---------------------------
   Add menu item
----------------------------*/

function addItem(){

  const centre = toGrid(
    (svg.clientWidth || 800)/2,
    (svg.clientHeight || 600)/2
  );

  const it = {
    id:crypto.randomUUID(),
    gx:centre.gx,
    gy:centre.gy,
    name:fName.value || "Item",
    price:fPrice.value || "$0",
    note:fNote.value || "",
    color:fColor.value,
    nibble:fNibble.checked,
    special:fSpecial.checked
  };

  state.items.push(it);
  state.selected = it;

  render();
  save();
}

function del(){
  if(!state.selected) return;
  state.items = state.items.filter(x=>x!==state.selected);
  state.selected=null;
  render();
  save();
}

/* ---------------------------
   Export dropdown — "menu" and "14x22 sign" both
   draw from the live state.items, just laid out
   differently (see the two functions below).
----------------------------*/

const exportToggle = document.getElementById("exportToggle");
const exportMenuEl = document.getElementById("exportMenu");

function openExportMenu(){
  // pin the menu below BOTH bars (the toolbar is 56px, the tabs
  // row below it ends at 92px) rather than positioning relative
  // to the toggle button itself, which sits inside the 56px
  // toolbar and would otherwise drop the menu right over the
  // tabs row
  const r = exportToggle.getBoundingClientRect();
  exportMenuEl.style.top = "98px";
  exportMenuEl.style.right = Math.max(8, window.innerWidth - r.right) + "px";
  exportMenuEl.classList.add("open");
}

exportToggle.addEventListener("click", (e)=>{
  e.stopPropagation();
  if(exportMenuEl.classList.contains("open")){
    exportMenuEl.classList.remove("open");
  }else{
    openExportMenu();
  }
});

exportMenuEl.addEventListener("click", (e)=>{
  const opt = e.target.closest(".dropdown-item");
  if(!opt) return;
  exportMenuEl.classList.remove("open");
  if(opt.dataset.action === "menu") exportMenuSVG();
  else if(opt.dataset.action === "sign") exportSignSVG();
});

document.addEventListener("click", ()=>{
  exportMenuEl.classList.remove("open");
});

window.addEventListener("resize", ()=>{
  exportMenuEl.classList.remove("open");
});

/* ---------------------------
   Export SVG — the menu.
   Auto-crops to your diamonds, adds the
   title (the current tab's name), brand
   background washes, and a whisper-faint
   diamond lattice across the whole sheet
   so the composition feels of-a-piece.
----------------------------*/

function exportMenuSVG(){

  if(!state.items.length){
    alert("Add some menu items first :)");
    return;
  }

  const s = state.scale;
  const title = currentMenuName();

  // bounds of all diamonds
  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  for(const it of state.items){
    const p = toScreen(it.gx,it.gy);
    minX = Math.min(minX, p.x - s);
    maxX = Math.max(maxX, p.x + s);
    minY = Math.min(minY, p.y - s);
    maxY = Math.max(maxY, p.y + s);
  }

  const pad = 48;
  const headerH = 128;
  const footerH = 60;
  const x0 = minX - pad;
  const y0 = minY - pad - headerH;
  const w  = (maxX - minX) + pad*2;
  const h  = (maxY - minY) + pad*2 + headerH + footerH;
  const cx = (minX + maxX)/2;

  let out = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${x0} ${y0} ${w} ${h}" width="${w}" height="${h}">`;

  out += `
    <style>
      @import url('https://api.fontshare.com/v2/css?f[]=satoshi@300,500,700&amp;display=swap');
      @import url('https://fonts.cdnfonts.com/css/bluu-next');
    </style>

    <defs>
      <radialGradient id="washRed" cx="25%" cy="25%" r="60%">
        <stop offset="0%" stop-color="#722F37" stop-opacity="0.04"/>
        <stop offset="100%" stop-color="#722F37" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="washOrange" cx="75%" cy="75%" r="60%">
        <stop offset="0%" stop-color="#CC5500" stop-opacity="0.03"/>
        <stop offset="100%" stop-color="#CC5500" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="#EDE8E0"/>
    <rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="url(#washRed)"/>
    <rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="url(#washOrange)"/>
  `;

  // ---- whisper lattice across the whole sheet (aligned to the working grid) ----
  {
    const u = s * 0.5;
    const lgx0 = Math.floor((x0 - state.ox)/u) - 1;
    const lgx1 = Math.ceil((x0 + w - state.ox)/u) + 1;
    const lgy0 = Math.floor((y0 - state.oy)/u) - 1;
    const lgy1 = Math.ceil((y0 + h - state.oy)/u) + 1;
    if((lgx1-lgx0)*(lgy1-lgy0) <= 40000){
      for(let gx=lgx0; gx<=lgx1; gx++){
        for(let gy=lgy0; gy<=lgy1; gy++){
          if(isLatticeCentre(gx,gy)){
            const p = toScreen(gx,gy);
            out += `
              <polygon
                points="${p.x},${p.y-s} ${p.x+s},${p.y} ${p.x},${p.y+s} ${p.x-s},${p.y}"
                fill="none" stroke="#722F37" stroke-opacity="0.05" stroke-width="1"
              />`;
          }
        }
      }
    }
  }

  // ---- title (current tab name) + service line ----
  // baseline sits low in the header so air above ≈ air below (optical centering)
  const titleY = y0 + 78;
  out += `
    <text x="${cx}" y="${titleY}" text-anchor="middle"
      font-size="32" font-weight="700" fill="#722F37"
      font-family="${FONT_NAME}" letter-spacing="3">${esc(title)}</text>

    <text x="${cx}" y="${titleY + 26}" text-anchor="middle"
      font-size="11" font-weight="300" fill="#6B5740" opacity="0.8"
      font-family="${FONT_NOTE}" letter-spacing="1.5">${TAGLINE_TEXT}</text>
  `;

  // ---- footer service line (same format as the one under the title) ----
  const footY = maxY + pad + 28;

  out += `
    <text x="${cx}" y="${footY}" text-anchor="middle"
      font-size="11" font-weight="300" fill="#6B5740" opacity="0.8"
      font-family="${FONT_NOTE}" letter-spacing="1.5">${FOOTER_TEXT}</text>
  `;

  // ---- diamonds with double borders + wrapped text ----
  for(const it of state.items){
    const p = toScreen(it.gx,it.gy);
    out += diamondItem(p.x, p.y, s, it.color, "#722F37", it.nibble);
    out += specialPattern(it, p.x, p.y, s);
    out += itemTexts(it, p.x, p.y, s);
  }

  out += `</svg>`;

  const blob = new Blob([out],{type:"image/svg+xml"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  const slug = title.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
  a.download = "gratified-" + (slug || "menu") + ".svg";
  a.click();
}

/* ---------------------------
   Export SVG — 14"x22" sign.
   A fixed-page poster version of the same brand system.
   It doesn't read the canvas's current pan/zoom — instead
   it keeps your items' relative grid arrangement, then
   auto-scales + centres that cluster to fit a true-to-size
   14"x22" page with room for a bigger header/footer. Works
   best with a fairly compact arrangement; a very spread-out
   layout will shrink diamonds a lot to keep everything on
   the fixed page.
----------------------------*/

function exportSignSVG(){

  if(!state.items.length){
    alert("Add some menu items first :)");
    return;
  }

  const PT_PER_IN = 72;
  const PAGE_W = 14 * PT_PER_IN;
  const PAGE_H = 22 * PT_PER_IN;
  const MARGIN = 56;
  const HEADER_H = 240;
  const FOOTER_H = 100;

  const title = currentMenuName();

  // bounding box of items, in grid units
  let gx0=Infinity, gx1=-Infinity, gy0=Infinity, gy1=-Infinity;
  for(const it of state.items){
    gx0 = Math.min(gx0, it.gx); gx1 = Math.max(gx1, it.gx);
    gy0 = Math.min(gy0, it.gy); gy1 = Math.max(gy1, it.gy);
  }
  const spanX = gx1 - gx0;
  const spanY = gy1 - gy0;

  const contentTop = MARGIN + HEADER_H;
  const contentBottom = PAGE_H - MARGIN - FOOTER_H;
  const availW = PAGE_W - MARGIN*2;
  const availH = contentBottom - contentTop;

  // solve for a diamond scale that fits the cluster's footprint
  // — spanX/Y*(s/2)+2*s, the same geometry toScreen() uses — into
  // the page's available space, then take whichever axis binds
  const sW = availW / (spanX/2 + 2);
  const sH = availH / (spanY/2 + 2);
  const s = Math.max(16, Math.min(sW, sH, 120));
  const u = s * 0.5;

  // centre the cluster's grid-space midpoint on the content area
  const gxMid = (gx0 + gx1) / 2;
  const gyMid = (gy0 + gy1) / 2;
  const cx = PAGE_W / 2;
  const cy = (contentTop + contentBottom) / 2;
  const sox = cx - gxMid * u;
  const soy = cy - gyMid * u;
  const sToScreen = (gx, gy) => ({ x: gx*u + sox, y: gy*u + soy });

  const titleSize = fitSingleLine(title, 700, FONT_NAME, 64, PAGE_W - MARGIN*2 - 60);

  let out = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${PAGE_W} ${PAGE_H}" width="14in" height="22in">`;

  out += `
    <style>
      @import url('https://api.fontshare.com/v2/css?f[]=satoshi@300,500,700&amp;display=swap');
      @import url('https://fonts.cdnfonts.com/css/bluu-next');
    </style>

    <defs>
      <radialGradient id="signWashRed" cx="20%" cy="10%" r="65%">
        <stop offset="0%" stop-color="#722F37" stop-opacity="0.06"/>
        <stop offset="100%" stop-color="#722F37" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="signWashOrange" cx="85%" cy="92%" r="65%">
        <stop offset="0%" stop-color="#CC5500" stop-opacity="0.05"/>
        <stop offset="100%" stop-color="#CC5500" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <rect x="0" y="0" width="${PAGE_W}" height="${PAGE_H}" fill="#EDE8E0"/>
    <rect x="0" y="0" width="${PAGE_W}" height="${PAGE_H}" fill="url(#signWashRed)"/>
    <rect x="0" y="0" width="${PAGE_W}" height="${PAGE_H}" fill="url(#signWashOrange)"/>
    <rect x="40" y="40" width="${PAGE_W-80}" height="${PAGE_H-80}" fill="none" stroke="#722F37" stroke-width="1.5" opacity="0.3"/>
  `;

  // ---- whisper lattice across the whole sheet ----
  {
    const lgx0 = Math.floor((0 - sox)/u) - 1;
    const lgx1 = Math.ceil((PAGE_W - sox)/u) + 1;
    const lgy0 = Math.floor((0 - soy)/u) - 1;
    const lgy1 = Math.ceil((PAGE_H - soy)/u) + 1;
    if((lgx1-lgx0)*(lgy1-lgy0) <= 60000){
      for(let gx=lgx0; gx<=lgx1; gx++){
        for(let gy=lgy0; gy<=lgy1; gy++){
          if(isLatticeCentre(gx,gy)){
            const p = sToScreen(gx,gy);
            out += `
              <polygon
                points="${p.x},${p.y-s} ${p.x+s},${p.y} ${p.x},${p.y+s} ${p.x-s},${p.y}"
                fill="none" stroke="#722F37" stroke-opacity="0.045" stroke-width="1"
              />`;
          }
        }
      }
    }
  }

  // ---- brand eyebrow + headline + tagline ----
  out += `
    <text x="${cx}" y="${MARGIN + 44}" text-anchor="middle"
      font-size="19" font-weight="700" fill="#CC5500"
      font-family="${FONT_PRICE}" letter-spacing="6">GRATIFIED</text>

    <text x="${cx}" y="${MARGIN + 140}" text-anchor="middle"
      font-size="${titleSize}" font-weight="700" fill="#722F37"
      font-family="${FONT_NAME}" letter-spacing="1">${esc(title)}</text>

    <text x="${cx}" y="${MARGIN + 182}" text-anchor="middle"
      font-size="15" font-weight="300" fill="#6B5740" opacity="0.85"
      font-family="${FONT_NOTE}" letter-spacing="2">${TAGLINE_TEXT}</text>

    <line x1="${cx-90}" y1="${MARGIN+206}" x2="${cx+90}" y2="${MARGIN+206}" stroke="#CC5500" stroke-width="1.5" opacity="0.6"/>
  `;

  // ---- diamonds with double borders + wrapped text ----
  for(const it of state.items){
    const p = sToScreen(it.gx, it.gy);
    out += diamondItem(p.x, p.y, s, it.color, "#722F37", it.nibble);
    out += specialPattern(it, p.x, p.y, s);
    out += itemTexts(it, p.x, p.y, s);
  }

  // ---- footer ----
  out += `
    <line x1="${cx-90}" y1="${PAGE_H-MARGIN-64}" x2="${cx+90}" y2="${PAGE_H-MARGIN-64}" stroke="#CC5500" stroke-width="1.5" opacity="0.6"/>
    <text x="${cx}" y="${PAGE_H-MARGIN-32}" text-anchor="middle"
      font-size="14" font-weight="300" fill="#6B5740" opacity="0.85"
      font-family="${FONT_NOTE}" letter-spacing="2">${FOOTER_TEXT}</text>
  `;

  out += `</svg>`;

  const blob = new Blob([out],{type:"image/svg+xml"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  const slug = title.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
  a.download = "gratified-sign-" + (slug || "menu") + ".svg";
  a.click();
}

/* --------------------------- */

// module scope: expose handlers for the toolbar's onclick attributes
window.addItem = addItem;
window.del = del;

render(); // show grid immediately

// boot: load the tab index, open the first tab,
// then hydrate that menu from Firebase
(async ()=>{
  await loadIndex();
  currentMenuId = menuIndex[0].id;
  renderTabs();
  await loadMenu(currentMenuId);
  render();
})();

// re-render once webfonts arrive so text wrapping
// is measured with the real Bluu Next / Satoshi metrics
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(render);
}

</script>
