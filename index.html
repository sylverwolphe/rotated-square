<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rotated Square — Menu Mode</title>

<!-- Fonts: Satoshi (Fontshare) + Bluu Next (CDN Fonts) -->
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,500,700&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/bluu-next" rel="stylesheet">

<style>
:root{
  --font-price:'Satoshi', system-ui, sans-serif;
  --font-name:'Bluu Next', Georgia, serif;
  --font-note:'Satoshi', system-ui, sans-serif;
}

html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  font-family:'Satoshi', system-ui;
  background:#f6f6f6;
}

#ui{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:52px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 10px;
  background:#111;
  color:white;
  z-index:10;
}

input{
  font-size:12px;
  padding:4px;
  font-family:inherit;
}

button{
  font-size:12px;
  font-family:inherit;
}

#wrap{
  position:absolute;
  inset:52px 0 0 0;
}

svg{
  width:100%;
  height:100%;
  background:#fff;
  cursor:grab;
}
svg:active{ cursor:grabbing; }

.item text{
  pointer-events:none;
  user-select:none;
}
</style>
</head>

<body>

<div id="ui">
  <input id="name" placeholder="item name" />
  <input id="price" placeholder="price" />
  <input id="note" placeholder="note" />
  <input type="color" id="color" value="#ffe08a"/>
  <button onclick="addItem()">Add Item</button>
  <button onclick="del()">Delete</button>
  <button onclick="exportSVG()">Export SVG</button>
</div>

<div id="wrap">
<svg id="svg"></svg>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD7a6t76FQj4FBJSObPntecdIypF9lhi_E",
  authDomain: "rotated-square.firebaseapp.com",
  databaseURL: "https://rotated-square-default-rtdb.firebaseio.com",
  projectId: "rotated-square",
  storageBucket: "rotated-square.firebasestorage.app",
  messagingSenderId: "185495802916",
  appId: "1:185495802916:web:54f9c7798477e6b292b4b1"
};

const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);
const menuRef = ref(db, "menus/default");

const svg = document.getElementById("svg");

let state = {
  scale: 40,
  ox: 0,
  oy: 0,
  dragging:false,
  dragStart:null,
  selected:null,
  items:[]
};

/* ---------------------------
   Persistence
   Primary: Firebase Realtime DB
   Fallback/cache: localStorage
   (writes are debounced so wheel
   zoom doesn't spam the network)
----------------------------*/

const STORE_KEY = "diamond-menu-v1";
let saveTimer = null;

function snapshot(){
  return {
    items: state.items,
    scale: state.scale,
    ox: state.ox,
    oy: state.oy
  };
}

function applySnapshot(data){
  if(!data) return;
  state.items = data.items || [];
  if(typeof data.scale === "number") state.scale = data.scale;
  if(typeof data.ox === "number") state.ox = data.ox;
  if(typeof data.oy === "number") state.oy = data.oy;
}

function save(){
  const data = snapshot();

  // instant local cache
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
  }catch(err){ /* private mode etc. */ }

  // debounced cloud write
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    set(menuRef, data).catch(err=>{
      console.error("Firebase save failed:", err);
    });
  }, 400);
}

async function load(){
  // try cloud first
  try{
    const snap = await get(menuRef);
    if(snap.exists()){
      applySnapshot(snap.val());
      return;
    }
  }catch(err){
    console.error("Firebase load failed, using local cache:", err);
  }

  // fall back to local cache
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) applySnapshot(JSON.parse(raw));
  }catch(err){
    console.error("Local load failed:", err);
  }
}

/* ---------------------------
   Typography (trad layout)
   PRICE (top)   → Satoshi 700
   NAME (middle) → Bluu Next
   NOTE (bottom) → Satoshi 300, lighter
----------------------------*/

const FONT_PRICE = "Satoshi, system-ui, sans-serif";
const FONT_NAME  = "'Bluu Next', Georgia, serif";
const FONT_NOTE  = "Satoshi, system-ui, sans-serif";

/* ---------------------------
   Diamond coordinate system
----------------------------*/

function toScreen(q,r){
  return {
    x:(q-r)*state.scale + state.ox,
    y:(q+r)*state.scale*0.5 + state.oy
  };
}

function toGrid(x,y){
  const dx = (x - state.ox)/state.scale;
  const dy = (y - state.oy)/(state.scale*0.5);

  return {
    q:Math.round((dx+dy)/2),
    r:Math.round((dy-dx)/2)
  };
}

/* ---------------------------
   Diamond shape
----------------------------*/

function diamond(x,y,s,fill,stroke){
  return `
    <polygon
      points="${x},${y-s} ${x+s},${y} ${x},${y+s} ${x-s},${y}"
      fill="${fill}"
      stroke="${stroke}"
    />
  `;
}

/* ---------------------------
   Render menu item
   (price top / name middle / note bottom)
----------------------------*/

function renderItem(it){
  const p = toScreen(it.q,it.r);
  const isSel = state.selected === it;

  return `
    <g class="item" data-id="${it.id}">

      ${diamond(
        p.x,p.y,
        state.scale*0.95,
        it.color,
        isSel ? "#ff0000" : "#333"
      )}

      <text x="${p.x}" y="${p.y-12}"
        text-anchor="middle"
        font-size="11"
        font-weight="700"
        font-family="${FONT_PRICE}"
        letter-spacing="0.5"
      >${it.price}</text>

      <text x="${p.x}" y="${p.y+4}"
        text-anchor="middle"
        font-size="13"
        font-family="${FONT_NAME}"
      >${it.name}</text>

      <text x="${p.x}" y="${p.y+18}"
        text-anchor="middle"
        font-size="9"
        font-weight="300"
        font-family="${FONT_NOTE}"
        opacity="0.6"
      >${it.note}</text>

    </g>
  `;
}

/* ---------------------------
   Render loop
----------------------------*/

function render(){

  let out = "";

  // light grid
  const range = 18;
  for(let q=-range;q<range;q++){
    for(let r=-range;r<range;r++){
      const p = toScreen(q,r);
      out += diamond(p.x,p.y,state.scale,"none","#eee");
    }
  }

  for(const it of state.items){
    out += renderItem(it);
  }

  svg.innerHTML = out;
}

/* ---------------------------
   Interaction
----------------------------*/

let draggingItem = null;

svg.addEventListener("mousedown",(e)=>{

  const g = e.target.closest?.("g");

  if(g){
    const id = g.dataset.id;
    const it = state.items.find(x=>x.id===id);
    state.selected = it;
    draggingItem = it;
    render();
    return;
  }

  state.dragging = true;
  state.dragStart = {x:e.clientX,y:e.clientY};
});

window.addEventListener("mousemove",(e)=>{

  if(state.dragging && !draggingItem){
    state.ox += e.clientX - state.dragStart.x;
    state.oy += e.clientY - state.dragStart.y;
    state.dragStart = {x:e.clientX,y:e.clientY};
    render();
  }

  if(draggingItem){
    const g = toGrid(e.clientX,e.clientY);
    draggingItem.q = g.q;
    draggingItem.r = g.r;
    render();
  }
});

window.addEventListener("mouseup",()=>{
  if(state.dragging || draggingItem) save();
  state.dragging = false;
  draggingItem = null;
});

/* zoom */

svg.addEventListener("wheel",(e)=>{
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.1 : 0.9;
  state.scale = Math.max(10,Math.min(120,state.scale*f));
  render();
  save();
});

/* ---------------------------
   Add menu item
----------------------------*/

function addItem(){

  state.items.push({
    id:crypto.randomUUID(),
    q:0,
    r:0,
    name:document.getElementById("name").value || "Item",
    price:document.getElementById("price").value || "$0",
    note:document.getElementById("note").value || "",
    color:document.getElementById("color").value
  });

  render();
  save();
}

function del(){
  if(!state.selected) return;
  state.items = state.items.filter(x=>x!==state.selected);
  state.selected=null;
  render();
  save();
}

/* ---------------------------
   Export SVG
   (same trad hierarchy, fonts embedded via @import
    so the exported file renders correctly online)
----------------------------*/

function exportSVG(){

  let out = `<svg xmlns="http://www.w3.org/2000/svg">`;

  out += `
    <style>
      @import url('https://api.fontshare.com/v2/css?f[]=satoshi@300,500,700&amp;display=swap');
      @import url('https://fonts.cdnfonts.com/css/bluu-next');
    </style>
  `;

  for(const it of state.items){
    const p = toScreen(it.q,it.r);
    const s = state.scale;

    out += `
      <polygon
        points="${p.x},${p.y-s} ${p.x+s},${p.y} ${p.x},${p.y+s} ${p.x-s},${p.y}"
        fill="${it.color}"
        stroke="black"
      />

      <text x="${p.x}" y="${p.y-12}" text-anchor="middle"
        font-size="11" font-weight="700"
        font-family="${FONT_PRICE}" letter-spacing="0.5">${it.price}</text>

      <text x="${p.x}" y="${p.y+4}" text-anchor="middle"
        font-size="13"
        font-family="${FONT_NAME}">${it.name}</text>

      <text x="${p.x}" y="${p.y+18}" text-anchor="middle"
        font-size="9" font-weight="300" opacity="0.6"
        font-family="${FONT_NOTE}">${it.note}</text>
    `;
  }

  out += `</svg>`;

  const blob = new Blob([out],{type:"image/svg+xml"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "menu.svg";
  a.click();
}

/* --------------------------- */

// module scope: expose handlers for the toolbar's onclick attributes
window.addItem = addItem;
window.del = del;
window.exportSVG = exportSVG;

render();           // show grid immediately
load().then(render); // then hydrate from Firebase

</script>

</body>
</html>
