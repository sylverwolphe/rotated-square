<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rotated Square — Menu Mode</title>

<!-- Fonts: Satoshi (Fontshare) + Bluu Next (CDN Fonts) -->
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,500,700&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/bluu-next" rel="stylesheet">

<style>
:root{
  /* Gratified design tokens */
  --deep-red: #722F37;
  --bright-orange: #CC5500;
  --warm-amber: #D2691E;
  --olive-bronze: #6B5740;
  --cream: #EDE8E0;
  --charcoal: #3C3C3C;
  --golden-sand: #E6C89C;

  --font-price:'Satoshi', system-ui, sans-serif;
  --font-name:'Bluu Next', Georgia, serif;
  --font-note:'Satoshi', system-ui, sans-serif;
}

html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  font-family:'Satoshi', system-ui;
  background:var(--cream);
}

#ui{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:56px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 14px;
  background:var(--cream);
  color:var(--charcoal);
  border-bottom:3px solid var(--deep-red);
  box-shadow:0 4px 20px rgba(114, 47, 55, 0.12);
  z-index:10;
}

#ui::before{
  content:'Gratified';
  font-family:var(--font-name);
  font-weight:700;
  color:var(--deep-red);
  letter-spacing:2px;
  font-size:16px;
  margin-right:6px;
}

input{
  font-size:12px;
  padding:6px 8px;
  font-family:inherit;
  border:2px solid rgba(114, 47, 55, 0.25);
  background:rgba(230, 200, 156, 0.15);
  color:var(--charcoal);
  outline:none;
  transition:border-color 0.3s ease;
}

input:focus{
  border-color:var(--bright-orange);
}

input::placeholder{
  color:var(--olive-bronze);
  opacity:0.6;
  text-transform:lowercase;
  letter-spacing:0.5px;
}

input[type="color"]{
  padding:2px;
  width:36px;
  height:30px;
  cursor:pointer;
}

#swatches{
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 6px;
}

#nibbleLabel{
  display:flex;
  align-items:center;
  gap:5px;
  font-size:12px;
  font-weight:600;
  letter-spacing:1px;
  text-transform:lowercase;
  color:var(--deep-red);
  cursor:pointer;
  user-select:none;
}

#nibbleLabel input{
  accent-color:var(--deep-red);
  cursor:pointer;
  width:14px;
  height:14px;
}

.swatch{
  width:18px;
  height:18px;
  transform:rotate(45deg);
  cursor:pointer;
  border:2px solid rgba(60,60,60,0.2);
  transition:transform 0.25s ease, border-color 0.25s ease;
}

.swatch:hover{
  transform:rotate(45deg) scale(1.2);
  border-color:var(--charcoal);
}

.swatch.current{
  border-color:var(--bright-orange);
}

button{
  font-size:12px;
  font-family:inherit;
  font-weight:600;
  letter-spacing:1px;
  text-transform:lowercase;
  padding:7px 16px;
  border:2px solid var(--deep-red);
  background:transparent;
  color:var(--deep-red);
  cursor:pointer;
  transition:all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

button:hover{
  background:var(--deep-red);
  color:var(--cream);
  letter-spacing:1.5px;
}

#wrap{
  position:absolute;
  inset:56px 0 0 0;
}

svg{
  width:100%;
  height:100%;
  background:var(--cream);
  cursor:grab;
}
svg:active{ cursor:grabbing; }

.item text{
  pointer-events:none;
  user-select:none;
}
</style>
</head>

<body>

<div id="ui">
  <input id="name" placeholder="item name" />
  <input id="price" placeholder="price" />
  <input id="note" placeholder="note" />
  <label id="nibbleLabel"><input type="checkbox" id="nibble"/> nibble</label>
  <div id="swatches" title="brand colors"></div>
  <input type="color" id="color" value="#E6C89C"/>
  <button onclick="addItem()">Add Item</button>
  <button onclick="del()">Delete</button>
  <button onclick="exportSVG()">Export SVG</button>
</div>

<div id="wrap">
<svg id="svg"></svg>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD7a6t76FQj4FBJSObPntecdIypF9lhi_E",
  authDomain: "rotated-square.firebaseapp.com",
  databaseURL: "https://rotated-square-default-rtdb.firebaseio.com",
  projectId: "rotated-square",
  storageBucket: "rotated-square.firebasestorage.app",
  messagingSenderId: "185495802916",
  appId: "1:185495802916:web:54f9c7798477e6b292b4b1"
};

const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);
const menuRef = ref(db, "menus/default");

const svg = document.getElementById("svg");

let state = {
  scale: 40,
  ox: 0,
  oy: 0,
  dragging:false,
  dragStart:null,
  selected:null,
  items:[]
};

/* ---------------------------
   Persistence
   Primary: Firebase Realtime DB
   Fallback/cache: localStorage
   (writes are debounced so wheel
   zoom doesn't spam the network)
----------------------------*/

const STORE_KEY = "diamond-menu-v1";
let saveTimer = null;

function snapshot(){
  return {
    items: state.items,
    scale: state.scale,
    ox: state.ox,
    oy: state.oy
  };
}

function applySnapshot(data){
  if(!data) return;
  // migrate old (q,r) items to the new (gx,gy) system
  state.items = (data.items || []).map(it=>{
    if(it.gx === undefined && it.q !== undefined){
      const m = { ...it, gx: it.q - it.r, gy: it.q + it.r };
      delete m.q; delete m.r;
      return m;
    }
    return it;
  });
  if(typeof data.scale === "number") state.scale = data.scale;
  if(typeof data.ox === "number") state.ox = data.ox;
  if(typeof data.oy === "number") state.oy = data.oy;
}

function save(){
  const data = snapshot();

  // instant local cache
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
  }catch(err){ /* private mode etc. */ }

  // debounced cloud write
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    set(menuRef, data).catch(err=>{
      console.error("Firebase save failed:", err);
    });
  }, 400);
}

async function load(){
  // try cloud first
  try{
    const snap = await get(menuRef);
    if(snap.exists()){
      applySnapshot(snap.val());
      return;
    }
  }catch(err){
    console.error("Firebase load failed, using local cache:", err);
  }

  // fall back to local cache
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) applySnapshot(JSON.parse(raw));
  }catch(err){
    console.error("Local load failed:", err);
  }
}

/* ---------------------------
   Typography (trad layout)
   PRICE (top)   → Satoshi 700
   NAME (middle) → Bluu Next
   NOTE (bottom) → Satoshi 300, lighter
----------------------------*/

const FONT_PRICE = "Satoshi, system-ui, sans-serif";
const FONT_NAME  = "'Bluu Next', Georgia, serif";
const FONT_NOTE  = "Satoshi, system-ui, sans-serif";

/* escape user text so "tea & honey" doesn't break the SVG */
function esc(str){
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

/* ---------------------------
   Diamond coordinate system
   gx = column, gy = half-step row.
   Any integer pair is valid — the old
   (q,r) system could only reach
   checkerboard positions.
----------------------------*/

function toScreen(gx,gy){
  return {
    x: gx*state.scale + state.ox,
    y: gy*state.scale*0.5 + state.oy
  };
}

function toGrid(x,y){
  return {
    gx: Math.round((x - state.ox)/state.scale),
    gy: Math.round((y - state.oy)/(state.scale*0.5))
  };
}

/* mouse coords → svg-local coords
   (fixes the toolbar-offset drift) */
function svgPoint(e){
  const r = svg.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

/* ---------------------------
   Diamond shape
----------------------------*/

function diamond(x,y,s,fill,stroke){
  return `
    <polygon
      points="${x},${y-s} ${x+s},${y} ${x},${y+s} ${x-s},${y}"
      fill="${fill}"
      stroke="${stroke}"
    />
  `;
}

/* Gratified signature: solid outer border
   + faint inset echo, like the site's
   .section::before / .value-item::before.
   Nibbles: the band between the outer edge
   and the inset line fills solid deep red,
   with a light line marking the boundary. */
function diamondItem(x,y,s,fill,stroke,nibble){
  const si = s*0.82;
  if(nibble){
    return `
      <polygon
        points="${x},${y-s} ${x+s},${y} ${x},${y+s} ${x-s},${y}"
        fill="#722F37"
        stroke="${stroke}"
        stroke-width="1.6"
        stroke-linejoin="round"
      />
      <polygon
        points="${x},${y-si} ${x+si},${y} ${x},${y+si} ${x-si},${y}"
        fill="${fill}"
        stroke="#EDE8E0"
        stroke-width="0.8"
        stroke-linejoin="round"
        opacity="0.9"
      />
    `;
  }
  return `
    <polygon
      points="${x},${y-s} ${x+s},${y} ${x},${y+s} ${x-s},${y}"
      fill="${fill}"
      stroke="${stroke}"
      stroke-width="1.6"
      stroke-linejoin="round"
    />
    <polygon
      points="${x},${y-si} ${x+si},${y} ${x},${y+si} ${x-si},${y}"
      fill="none"
      stroke="${stroke}"
      stroke-width="0.8"
      stroke-linejoin="round"
      opacity="0.35"
    />
  `;
}

/* ---------------------------
   Render menu item
   (price top / name middle / note bottom)
----------------------------*/

function renderItem(it){
  const p = toScreen(it.gx,it.gy);
  const isSel = state.selected === it;

  return `
    <g class="item" data-id="${it.id}">

      ${diamondItem(
        p.x,p.y,
        state.scale,
        it.color,
        isSel ? "#CC5500" : "#722F37",
        it.nibble
      )}

      <text x="${p.x}" y="${p.y-13}"
        text-anchor="middle"
        font-size="9.5"
        font-weight="500"
        font-family="${FONT_PRICE}"
        letter-spacing="1"
        fill="#6B5740"
        opacity="0.85"
      >${esc(it.price)}</text>

      <text x="${p.x}" y="${p.y+4}"
        text-anchor="middle"
        font-size="14"
        font-family="${FONT_NAME}"
        font-weight="700"
        fill="#722F37"
      >${esc(it.name)}</text>

      <text x="${p.x}" y="${p.y+18}"
        text-anchor="middle"
        font-size="9"
        font-weight="300"
        font-family="${FONT_NOTE}"
        fill="#6B5740"
        opacity="0.85"
      >${esc(it.note)}</text>

    </g>
  `;
}

/* ---------------------------
   Render loop
----------------------------*/

function render(){

  let out = "";

  // grid: computed from the visible viewport so it never runs out when panning
  const w = svg.clientWidth || 800;
  const h = svg.clientHeight || 600;
  const s = state.scale;

  const gx0 = Math.floor((0 - state.ox)/s) - 1;
  const gx1 = Math.ceil((w - state.ox)/s) + 1;
  const gy0 = Math.floor((0 - state.oy)/(s*0.5)) - 1;
  const gy1 = Math.ceil((h - state.oy)/(s*0.5)) + 1;

  const cells = (gx1-gx0)*(gy1-gy0);

  if(cells <= 12000){
    for(let gx=gx0; gx<=gx1; gx++){
      for(let gy=gy0; gy<=gy1; gy++){
        const p = toScreen(gx,gy);
        if((gx+gy) % 2 === 0){
          // tiling outline (the classic lattice look)
          out += diamond(p.x,p.y,s,"none","rgba(114, 47, 55, 0.08)");
        }
        // dot at every placeable centre
        out += `<circle cx="${p.x}" cy="${p.y}" r="1.5" fill="rgba(114, 47, 55, 0.18)"/>`;
      }
    }
  }

  for(const it of state.items){
    out += renderItem(it);
  }

  svg.innerHTML = out;
}

/* ---------------------------
   Interaction
----------------------------*/

let draggingItem = null;
let dragOffset = {x:0, y:0};

const fName  = document.getElementById("name");
const fPrice = document.getElementById("price");
const fNote  = document.getElementById("note");
const fColor = document.getElementById("color");
const fNibble = document.getElementById("nibble");

function populateFields(it){
  fName.value  = it.name;
  fPrice.value = it.price;
  fNote.value  = it.note;
  fColor.value = it.color;
  fNibble.checked = !!it.nibble;
}

svg.addEventListener("mousedown",(e)=>{

  const g = e.target.closest?.("g");
  const pt = svgPoint(e);

  if(g){
    const id = g.dataset.id;
    const it = state.items.find(x=>x.id===id);
    state.selected = it;
    draggingItem = it;
    // remember where inside the diamond you grabbed,
    // so it doesn't jump to centre-on-cursor
    const p = toScreen(it.gx, it.gy);
    dragOffset = { x: p.x - pt.x, y: p.y - pt.y };
    populateFields(it);
    render();
    return;
  }

  // empty canvas: deselect + start panning
  state.selected = null;
  state.dragging = true;
  state.dragStart = {x:e.clientX,y:e.clientY};
  render();
});

window.addEventListener("mousemove",(e)=>{

  if(state.dragging && !draggingItem){
    state.ox += e.clientX - state.dragStart.x;
    state.oy += e.clientY - state.dragStart.y;
    state.dragStart = {x:e.clientX,y:e.clientY};
    render();
  }

  if(draggingItem){
    const pt = svgPoint(e);
    const g = toGrid(pt.x + dragOffset.x, pt.y + dragOffset.y);
    if(g.gx !== draggingItem.gx || g.gy !== draggingItem.gy){
      draggingItem.gx = g.gx;
      draggingItem.gy = g.gy;
      render();
    }
  }
});

/* live edit: typing updates the selected diamond */
function liveEdit(field, input){
  input.addEventListener("input", ()=>{
    if(!state.selected) return;
    state.selected[field] = input.value;
    render();
    save();
  });
}
liveEdit("name",  fName);
liveEdit("price", fPrice);
liveEdit("note",  fNote);
liveEdit("color", fColor);

/* nibble checkbox: live toggle on the selected diamond */
fNibble.addEventListener("change", ()=>{
  if(!state.selected) return;
  state.selected.nibble = fNibble.checked;
  render();
  save();
});

/* ---------------------------
   Brand color swatches
----------------------------*/

const BRAND_COLORS = [
  { name:"deep red",      hex:"#722F37" },
  { name:"bright orange", hex:"#CC5500" },
  { name:"warm amber",    hex:"#D2691E" },
  { name:"olive bronze",  hex:"#6B5740" },
  { name:"golden sand",   hex:"#E6C89C" },
  { name:"cream",         hex:"#EDE8E0" }
];

const swatchBox = document.getElementById("swatches");

for(const c of BRAND_COLORS){
  const el = document.createElement("div");
  el.className = "swatch";
  el.style.background = c.hex;
  el.title = c.name;
  el.addEventListener("click", ()=>{
    fColor.value = c.hex;
    swatchBox.querySelectorAll(".swatch").forEach(s=>s.classList.remove("current"));
    el.classList.add("current");
    if(state.selected){
      state.selected.color = c.hex;
      render();
      save();
    }
  });
  swatchBox.appendChild(el);
}

window.addEventListener("mouseup",()=>{
  if(state.dragging || draggingItem) save();
  state.dragging = false;
  draggingItem = null;
});

window.addEventListener("resize", render);

/* zoom */

svg.addEventListener("wheel",(e)=>{
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.1 : 0.9;
  state.scale = Math.max(10,Math.min(120,state.scale*f));
  render();
  save();
});

/* ---------------------------
   Add menu item
----------------------------*/

function addItem(){

  const centre = toGrid(
    (svg.clientWidth || 800)/2,
    (svg.clientHeight || 600)/2
  );

  const it = {
    id:crypto.randomUUID(),
    gx:centre.gx,
    gy:centre.gy,
    name:fName.value || "Item",
    price:fPrice.value || "$0",
    note:fNote.value || "",
    color:fColor.value,
    nibble:fNibble.checked
  };

  state.items.push(it);
  state.selected = it;

  render();
  save();
}

function del(){
  if(!state.selected) return;
  state.items = state.items.filter(x=>x!==state.selected);
  state.selected=null;
  render();
  save();
}

/* ---------------------------
   Export SVG — the final menu.
   Auto-crops to your diamonds, adds the
   Gratified wordmark header, brand
   background washes, and the double-
   border treatment on every diamond.
----------------------------*/

function exportSVG(){

  if(!state.items.length){
    alert("Add some menu items first :)");
    return;
  }

  const s = state.scale;

  // bounds of all diamonds
  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  for(const it of state.items){
    const p = toScreen(it.gx,it.gy);
    minX = Math.min(minX, p.x - s);
    maxX = Math.max(maxX, p.x + s);
    minY = Math.min(minY, p.y - s);
    maxY = Math.max(maxY, p.y + s);
  }

  const pad = 36;
  const headerH = 92;
  const footerH = 48;
  const x0 = minX - pad;
  const y0 = minY - pad - headerH;
  const w  = (maxX - minX) + pad*2;
  const h  = (maxY - minY) + pad*2 + headerH + footerH;
  const cx = (minX + maxX)/2;

  let out = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${x0} ${y0} ${w} ${h}" width="${w}" height="${h}">`;

  out += `
    <style>
      @import url('https://api.fontshare.com/v2/css?f[]=satoshi@300,500,700&amp;display=swap');
      @import url('https://fonts.cdnfonts.com/css/bluu-next');
    </style>

    <defs>
      <radialGradient id="washRed" cx="25%" cy="25%" r="60%">
        <stop offset="0%" stop-color="#722F37" stop-opacity="0.04"/>
        <stop offset="100%" stop-color="#722F37" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="washOrange" cx="75%" cy="75%" r="60%">
        <stop offset="0%" stop-color="#CC5500" stop-opacity="0.03"/>
        <stop offset="100%" stop-color="#CC5500" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="#EDE8E0"/>
    <rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="url(#washRed)"/>
    <rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="url(#washOrange)"/>
  `;

  // ---- title ----
  out += `
    <text x="${cx}" y="${y0 + 62}" text-anchor="middle"
      font-size="32" font-weight="700" fill="#722F37"
      font-family="${FONT_NAME}" letter-spacing="3">Drinks and nibbles</text>
  `;

  // ---- footer note ----
  out += `
    <text x="${cx}" y="${maxY + pad + 30}" text-anchor="middle"
      font-size="11" font-weight="300" fill="#6B5740" opacity="0.75"
      font-family="${FONT_NOTE}" letter-spacing="0.5">Pricing includes tax. Suggested tip 50&#162;/item.</text>
  `;

  // ---- diamonds with double borders ----
  for(const it of state.items){
    const p = toScreen(it.gx,it.gy);

    out += diamondItem(p.x, p.y, s, it.color, "#722F37", it.nibble);

    out += `
      <text x="${p.x}" y="${p.y-13}" text-anchor="middle"
        font-size="9.5" font-weight="500" fill="#6B5740" opacity="0.85"
        font-family="${FONT_PRICE}" letter-spacing="1">${esc(it.price)}</text>

      <text x="${p.x}" y="${p.y+4}" text-anchor="middle"
        font-size="14" font-weight="700" fill="#722F37"
        font-family="${FONT_NAME}">${esc(it.name)}</text>

      <text x="${p.x}" y="${p.y+18}" text-anchor="middle"
        font-size="9" font-weight="300" fill="#6B5740" opacity="0.85"
        font-family="${FONT_NOTE}">${esc(it.note)}</text>
    `;
  }

  out += `</svg>`;

  const blob = new Blob([out],{type:"image/svg+xml"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "gratified-menu.svg";
  a.click();
}

/* --------------------------- */

// module scope: expose handlers for the toolbar's onclick attributes
window.addItem = addItem;
window.del = del;
window.exportSVG = exportSVG;

render();           // show grid immediately
load().then(render); // then hydrate from Firebase

</script>

</body>
</html>
