<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rotated Square</title>

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  font-family:system-ui;
  background:#f6f6f6;
}

#ui{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:52px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 10px;
  background:#111;
  color:white;
  z-index:10;
}

button,input{
  font-size:12px;
}

#wrap{
  position:absolute;
  inset:52px 0 0 0;
}

svg{
  width:100%;
  height:100%;
  background:#fff;
  cursor:grab;
}

svg:active{ cursor:grabbing; }

.diamond{
  cursor:pointer;
  transition:all 0.05s linear;
}

.label{
  pointer-events:none;
  font-size:12px;
  user-select:none;
}
</style>
</head>

<body>

<div id="ui">
  <button onclick="addDiamond()">Add</button>
  <button onclick="del()">Delete</button>
  <input type="color" id="color" value="#ffcc66"/>
  <input id="text" placeholder="text"/>
  <button onclick="save()">Save</button>
  <button onclick="load()">Load</button>
  <button onclick="exportSVG()">Export SVG</button>
</div>

<div id="wrap">
<svg id="svg"></svg>
</div>

<script>

const svg = document.getElementById("svg");

let state = {
  scale: 40,
  ox: 0,
  oy: 0,
  dragging:false,
  dragStart:null,
  selected:null,
  nodes:[]
};

/* ---------------------------
   Diamond coordinate system
----------------------------*/

function toScreen(q,r){
  const x = (q - r) * state.scale + state.ox;
  const y = (q + r) * state.scale * 0.5 + state.oy;
  return {x,y};
}

function toGrid(x,y){
  const dx = (x - state.ox) / state.scale;
  const dy = (y - state.oy) / (state.scale * 0.5);

  const q = Math.round((dx + dy)/2);
  const r = Math.round((dy - dx)/2);

  return {q,r};
}

/* ---------------------------
   Rendering
----------------------------*/

function drawDiamond(x,y,s,fill,stroke){
  return `
    <polygon
      points="${x},${y-s} ${x+s},${y} ${x},${y+s} ${x-s},${y}"
      fill="${fill}"
      stroke="${stroke}"
      stroke-width="1"
    />
  `;
}

function render(){

  let html = "";

  // grid (light)
  const range = 20;
  for(let q=-range;q<range;q++){
    for(let r=-range;r<range;r++){
      const p = toScreen(q,r);
      html += drawDiamond(p.x,p.y,state.scale,"none","#eee");
    }
  }

  // nodes
  for(const n of state.nodes){
    const p = toScreen(n.q,n.r);

    const isSel = state.selected === n;

    html += `
      <g class="diamond" data-id="${n.id}">
        ${drawDiamond(
          p.x,p.y,
          state.scale*0.95,
          n.color,
          isSel ? "#ff0000" : "#333"
        )}
        <text x="${p.x}" y="${p.y+4}"
          text-anchor="middle"
          class="label"
        >${n.text || ""}</text>
      </g>
    `;
  }

  svg.innerHTML = html;
}

/* ---------------------------
   Interaction
----------------------------*/

let draggingNode = null;

svg.addEventListener("mousedown",(e)=>{

  const target = e.target.closest?.("g");
  if(target){
    const id = target.dataset.id;
    const n = state.nodes.find(x=>x.id==id);
    state.selected = n;
    draggingNode = n;
    render();
    return;
  }

  state.dragging = true;
  state.dragStart = {x:e.clientX,y:e.clientY};
});

window.addEventListener("mousemove",(e)=>{

  // pan
  if(state.dragging && !draggingNode){
    state.ox += e.clientX - state.dragStart.x;
    state.oy += e.clientY - state.dragStart.y;
    state.dragStart = {x:e.clientX,y:e.clientY};
    render();
  }

  // drag node
  if(draggingNode){
    const g = toGrid(e.clientX,e.clientY);
    draggingNode.q = g.q;
    draggingNode.r = g.r;
    render();
  }
});

window.addEventListener("mouseup",()=>{

  state.dragging = false;
  draggingNode = null;
});

/* zoom */

svg.addEventListener("wheel",(e)=>{
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.1 : 0.9;
  state.scale *= f;
  state.scale = Math.max(10,Math.min(120,state.scale));
  render();
});

/* click empty -> create */

svg.addEventListener("click",(e)=>{

  if(e.target.tagName !== "svg") return;

  const g = toGrid(e.clientX,e.clientY);

  const node = {
    id:crypto.randomUUID(),
    q:g.q,
    r:g.r,
    color:document.getElementById("color").value,
    text:document.getElementById("text").value || "◆"
  };

  state.nodes.push(node);
  state.selected = node;
  render();
});

/* ---------------------------
   UI actions
----------------------------*/

function addDiamond(){
  state.nodes.push({
    id:crypto.randomUUID(),
    q:0,r:0,
    color:"#ffcc66",
    text:"◆"
  });
  render();
}

function del(){
  if(!state.selected) return;
  state.nodes = state.nodes.filter(n=>n!==state.selected);
  state.selected=null;
  render();
}

function save(){
  localStorage.setItem("rotated-square",JSON.stringify(state.nodes));
}

function load(){
  const data = JSON.parse(localStorage.getItem("rotated-square")||"[]");
  state.nodes = data;
  render();
}

function exportSVG(){

  let out = `<svg xmlns="http://www.w3.org/2000/svg">`;

  for(const n of state.nodes){
    const p = toScreen(n.q,n.r);
    const s = state.scale;

    out += `
      <polygon
        points="${p.x},${p.y-s} ${p.x+s},${p.y} ${p.x},${p.y+s} ${p.x-s},${p.y}"
        fill="${n.color}"
        stroke="black"
      />
    `;
  }

  out += `</svg>`;

  const blob = new Blob([out],{type:"image/svg+xml"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "rotated-square.svg";
  a.click();
}

/* --------------------------- */

render();

</script>

</body>
</html>
