<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rotated Square — Menu Mode</title>

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  font-family:system-ui;
  background:#f6f6f6;
}

#ui{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:52px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 10px;
  background:#111;
  color:white;
  z-index:10;
}

input{
  font-size:12px;
  padding:4px;
}

button{
  font-size:12px;
}

#wrap{
  position:absolute;
  inset:52px 0 0 0;
}

svg{
  width:100%;
  height:100%;
  background:#fff;
  cursor:grab;
}
svg:active{ cursor:grabbing; }

.item text{
  pointer-events:none;
  user-select:none;
}
</style>
</head>

<body>

<div id="ui">
  <input id="name" placeholder="item name" />
  <input id="price" placeholder="price" />
  <input id="note" placeholder="note" />
  <input type="color" id="color" value="#ffe08a"/>
  <button onclick="addItem()">Add Item</button>
  <button onclick="del()">Delete</button>
  <button onclick="exportSVG()">Export SVG</button>
</div>

<div id="wrap">
<svg id="svg"></svg>
</div>

<script>

const svg = document.getElementById("svg");

let state = {
  scale: 40,
  ox: 0,
  oy: 0,
  dragging:false,
  dragStart:null,
  selected:null,
  items:[]
};

/* ---------------------------
   Diamond coordinate system
----------------------------*/

function toScreen(q,r){
  return {
    x:(q-r)*state.scale + state.ox,
    y:(q+r)*state.scale*0.5 + state.oy
  };
}

function toGrid(x,y){
  const dx = (x - state.ox)/state.scale;
  const dy = (y - state.oy)/(state.scale*0.5);

  return {
    q:Math.round((dx+dy)/2),
    r:Math.round((dy-dx)/2)
  };
}

/* ---------------------------
   Diamond shape
----------------------------*/

function diamond(x,y,s,fill,stroke){
  return `
    <polygon
      points="${x},${y-s} ${x+s},${y} ${x},${y+s} ${x-s},${y}"
      fill="${fill}"
      stroke="${stroke}"
    />
  `;
}

/* ---------------------------
   Render menu item
----------------------------*/

function renderItem(it){
  const p = toScreen(it.q,it.r);
  const isSel = state.selected === it;

  return `
    <g class="item" data-id="${it.id}">

      ${diamond(
        p.x,p.y,
        state.scale*0.95,
        it.color,
        isSel ? "#ff0000" : "#333"
      )}

      <text x="${p.x}" y="${p.y-10}"
        text-anchor="middle"
        font-size="12"
        font-weight="600"
      >${it.name}</text>

      <text x="${p.x}" y="${p.y+4}"
        text-anchor="middle"
        font-size="11"
      >${it.price}</text>

      <text x="${p.x}" y="${p.y+18}"
        text-anchor="middle"
        font-size="9"
        opacity="0.7"
      >${it.note}</text>

    </g>
  `;
}

/* ---------------------------
   Render loop
----------------------------*/

function render(){

  let out = "";

  // light grid
  const range = 18;
  for(let q=-range;q<range;q++){
    for(let r=-range;r<range;r++){
      const p = toScreen(q,r);
      out += diamond(p.x,p.y,state.scale,"none","#eee");
    }
  }

  for(const it of state.items){
    out += renderItem(it);
  }

  svg.innerHTML = out;
}

/* ---------------------------
   Interaction
----------------------------*/

let draggingItem = null;

svg.addEventListener("mousedown",(e)=>{

  const g = e.target.closest?.("g");

  if(g){
    const id = g.dataset.id;
    const it = state.items.find(x=>x.id===id);
    state.selected = it;
    draggingItem = it;
    render();
    return;
  }

  state.dragging = true;
  state.dragStart = {x:e.clientX,y:e.clientY};
});

window.addEventListener("mousemove",(e)=>{

  if(state.dragging && !draggingItem){
    state.ox += e.clientX - state.dragStart.x;
    state.oy += e.clientY - state.dragStart.y;
    state.dragStart = {x:e.clientX,y:e.clientY};
    render();
  }

  if(draggingItem){
    const g = toGrid(e.clientX,e.clientY);
    draggingItem.q = g.q;
    draggingItem.r = g.r;
    render();
  }
});

window.addEventListener("mouseup",()=>{
  state.dragging = false;
  draggingItem = null;
});

/* zoom */

svg.addEventListener("wheel",(e)=>{
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.1 : 0.9;
  state.scale = Math.max(10,Math.min(120,state.scale*f));
  render();
});

/* ---------------------------
   Add menu item
----------------------------*/

function addItem(){

  state.items.push({
    id:crypto.randomUUID(),
    q:0,
    r:0,
    name:document.getElementById("name").value || "Item",
    price:document.getElementById("price").value || "$0",
    note:document.getElementById("note").value || "",
    color:document.getElementById("color").value
  });

  render();
}

function del(){
  if(!state.selected) return;
  state.items = state.items.filter(x=>x!==state.selected);
  state.selected=null;
  render();
}

/* ---------------------------
   Export SVG
----------------------------*/

function exportSVG(){

  let out = `<svg xmlns="http://www.w3.org/2000/svg">`;

  for(const it of state.items){
    const p = toScreen(it.q,it.r);
    const s = state.scale;

    out += `
      <polygon
        points="${p.x},${p.y-s} ${p.x+s},${p.y} ${p.x},${p.y+s} ${p.x-s},${p.y}"
        fill="${it.color}"
        stroke="black"
      />

      <text x="${p.x}" y="${p.y-8}" text-anchor="middle">${it.name}</text>
      <text x="${p.x}" y="${p.y+5}" text-anchor="middle">${it.price}</text>
      <text x="${p.x}" y="${p.y+18}" text-anchor="middle">${it.note}</text>
    `;
  }

  out += `</svg>`;

  const blob = new Blob([out],{type:"image/svg+xml"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "menu.svg";
  a.click();
}

/* --------------------------- */

render();

</script>

</body>
</html>
